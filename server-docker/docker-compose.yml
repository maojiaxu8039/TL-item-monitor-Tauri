version: '3.8'

services:
  tl-monitor:
    image: ghcr.io/maojiaxu8039/tl-monitor-server:latest
    container_name: tl-monitor
    restart: unless-stopped
    ports:
      - "38457:8080"
    volumes:
      - ./data:/data
      - ./config:/app/config
      - ./resources:/app/resources
    environment:
      - RUST_LOG=info
      - TL_DB_PATH=/data/tl_monitor.db
      - TL_CONFIG_PATH=/app/config/server_config.yaml
      - TL_RESOURCES_DIR=/app/resources
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s