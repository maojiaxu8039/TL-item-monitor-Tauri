version: '3.8'
services:
  tl-monitor:
    image: debian:bookworm-slim
    container_name: tl-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "38457:8080"
    volumes:
      - ./data:/data
      - ./config:/config
      - ./resources:/app/resources
    environment:
      - RUST_LOG=info
      - TL_DB_PATH=/data/tl_monitor.db
      - TL_CONFIG_PATH=/config/server_config.yaml
    command:
      - "/bin/sh"
      - "-c"
      - "apt-get update && apt-get install -y curl ca-certificates && chmod +x /app/resources/qiandao_fire && /app/server"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
