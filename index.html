<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TL物品火价监控</title>
<style>
:root {
  --bg: #0b0e17; --surface: #13172a; --surface2: #1a2035; --border: #252a40;
  --fire: #f59e0b; --rmb: #34d399; --danger: #f87171; --text: #e2e8f0; --muted: #64748b;
  --green: #4ade80; --red: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
.header {
  height: 56px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  flex-shrink: 0; -webkit-app-region: drag;
}
.header-left { display: flex; align-items: center; gap: 12px; -webkit-app-region: no-drag; }
.header-right { display: flex; align-items: center; gap: 12px; -webkit-app-region: no-drag; }
.fire-badge {
  display: flex; align-items: center; gap: 6px;
  background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4);
  color: var(--fire); padding: 6px 14px; border-radius: 20px; font-size: 15px;
  font-weight: 600; cursor: pointer; transition: all 0.2s; -webkit-app-region: no-drag;
}
.fire-badge:hover { background: rgba(245,158,11,0.25); }
.fire-badge .spinner {
  width: 14px; height: 14px; border: 2px solid rgba(245,158,11,0.3);
  border-top-color: var(--fire); border-radius: 50%;
  animation: spin 0.8s linear infinite; display: none;
}
.fire-badge.loading .spinner { display: block; }
.fire-badge.loading .fire-icon { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-text { color: var(--muted); font-size: 13px; }
.tabs {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; flex-shrink: 0;
}
.tab-btn {
  padding: 12px 20px; background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.2s; font-family: inherit;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--fire); border-bottom-color: var(--fire); }
.main { flex: 1; overflow-y: auto; padding: 20px; }
.main.hidden { display: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.section-toolbar {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.section-toolbar h2 { font-size: 16px; color: var(--muted); font-weight: 500; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
  border-radius: 6px; border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); font-size: 13px; cursor: pointer; transition: all 0.15s;
  font-family: inherit;
}
.btn:hover { border-color: var(--fire); color: var(--fire); }
.btn-primary { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4); color: var(--fire); }
.btn-primary:hover { background: rgba(245,158,11,0.25); }
.btn-danger { border-color: rgba(248,113,113,0.4); color: var(--danger); }
.btn-danger:hover { background: rgba(248,113,113,0.15); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.section-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 16px; overflow: hidden;
}
.section-header {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid var(--border); background: var(--surface2);
}
.drag-handle { color: var(--muted); cursor: grab; font-size: 16px; padding: 0 4px; }
.section-name-input {
  background: transparent; border: 1px solid transparent; color: var(--text);
  font-size: 15px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
  flex: 1; font-family: inherit; min-width: 80px;
}
.section-name-input:hover { border-color: var(--border); }
.section-name-input:focus { outline: none; border-color: var(--fire); background: var(--surface); }
.damage-label { color: var(--muted); font-size: 12px; white-space: nowrap; }
.damage-input {
  width: 70px; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 3px 8px; border-radius: 4px;
  font-family: inherit; font-size: 13px; text-align: right;
}
.damage-input:focus { outline: none; border-color: var(--fire); }
.section-stats {
  display: flex; gap: 20px; padding: 8px 16px; border-bottom: 1px solid var(--border);
  font-size: 13px; color: var(--muted);
}
.stat-value { color: var(--text); font-weight: 600; margin-left: 4px; }
.stat-fire { color: var(--fire); }
.stat-rmb { color: var(--rmb); }
.section-collapse { color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 16px; transition: transform 0.2s; }
.section-collapse.collapsed { transform: rotate(-90deg); }
.section-actions { display: flex; gap: 6px; margin-left: auto; }
.section-body { padding: 12px 16px; }
.section-body.hidden { display: none; }
.items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.items-table th {
  text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 500;
}
.items-table td { padding: 8px 8px; border-bottom: 1px solid rgba(37,42,64,0.5); vertical-align: middle; }
.items-table tr:last-child td { border-bottom: none; }
.items-table tr:hover td { background: rgba(255,255,255,0.02); }
.col-name { min-width: 120px; }
.col-more, .col-count, .col-fire, .col-rmb, .col-10m, .col-time { text-align: right; }
.col-worth { text-align: center; }
.col-action { width: 40px; text-align: center; }
.items-table input[type="number"] {
  width: 70px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 3px 6px; border-radius: 4px;
  font-size: 12px; text-align: right; font-family: inherit;
}
.items-table input[type="number"]:focus { outline: none; border-color: var(--fire); }
.worth-yes { color: var(--green); font-weight: 600; }
.worth-no { color: var(--red); font-weight: 600; }
.delete-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 14px; padding: 2px 6px; border-radius: 3px; transition: all 0.15s;
}
.delete-btn:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
.add-item-row {
  display: flex; align-items: center; gap: 8px; padding: 10px 0 0;
  border-top: 1px solid var(--border); margin-top: 8px;
}
.add-item-row select {
  flex: 1; min-width: 150px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 13px;
  font-family: inherit; cursor: pointer;
}
.add-item-row select:focus { outline: none; border-color: var(--fire); }
.add-item-row select option { background: var(--surface2); }
.add-item-row input { width: 70px; }
.search-container { margin-bottom: 20px; }
.search-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 15px;
  font-family: inherit; transition: border-color 0.2s;
}
.search-input:focus { outline: none; border-color: var(--fire); }
.search-input::placeholder { color: var(--muted); }
.search-results { display: flex; flex-direction: column; gap: 6px; }
.search-result-item {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: all 0.15s;
}
.search-result-item:hover { border-color: var(--fire); background: rgba(245,158,11,0.05); }
.result-name { font-size: 14px; }
.result-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.result-type { background: var(--surface2); padding: 2px 6px; border-radius: 3px; }
.result-fire { color: var(--fire); font-weight: 600; }
.result-rmb { color: var(--rmb); }
.chart-container {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
}
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.chart-header h3 { font-size: 15px; color: var(--muted); font-weight: 500; }
#fireChart { width: 100%; height: 350px; display: block; }
.settings-container { max-width: 500px; }
.settings-group {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin-bottom: 16px;
}
.settings-group h3 {
  font-size: 14px; color: var(--muted); margin-bottom: 16px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.setting-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.setting-row:last-child { margin-bottom: 0; }
.setting-label { font-size: 14px; }
.setting-label span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.setting-row select, .setting-row input[type="number"], .setting-row input[type="password"] {
  width: 180px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; font-family: inherit;
}
.setting-row select:focus, .setting-row input:focus { outline: none; border-color: var(--fire); }
.save-msg { color: var(--green); font-size: 13px; margin-top: 8px; display: none; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; display: none;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; min-width: 320px; max-width: 400px;
}
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.modal-section-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.modal-section-item {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: all 0.15s;
}
.modal-section-item:hover { border-color: var(--fire); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.empty-state { text-align: center; padding: 40px; color: var(--muted); }
.empty-state p { margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="fire-badge" id="fireBadge" title="点击刷新火价" onclick="refreshFirePrice()">
      <span class="spinner"></span>
      <span class="fire-icon">🔥</span>
      <span id="firePriceText">加载中...</span>
    </div>
  </div>
  <div class="header-right">
    <span class="status-text" id="syncStatus">已同步 --:--</span>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="monitor" onclick="switchTab('monitor')">监控面板</button>
  <button class="tab-btn" data-tab="search" onclick="switchTab('search')">物品搜索</button>
  <button class="tab-btn" data-tab="history" onclick="switchTab('history')">历史走势</button>
  <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">设置</button>
</div>

<div class="main" id="tab-monitor">
  <div class="section-toolbar">
    <h2>监控板块</h2>
    <button class="btn btn-primary" onclick="addSection()">＋ 添加板块</button>
  </div>
  <div id="sectionsContainer"></div>
</div>

<div class="main hidden" id="tab-search">
  <div class="search-container">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索物品名称..." oninput="doSearch()" onkeydown="if(event.key==='Enter')doSearch()">
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="main hidden" id="tab-history">
  <div class="chart-container">
    <div class="chart-header">
      <h3>火价历史走势</h3>
      <button class="btn" onclick="loadChart()">↻ 刷新</button>
    </div>
    <canvas id="fireChart"></canvas>
  </div>
</div>

<div class="main hidden" id="tab-settings">
  <div class="settings-container">
    <div class="settings-group">
      <h3>通用设置</h3>
      <div class="setting-row">
        <div class="setting-label">赛季模式<span>选择当前赛季类型</span></div>
        <select id="cfg_mode">
          <option value="赛季普通">赛季普通</option>
          <option value="赛季专家">赛季专家</option>
        </select>
      </div>
      <div class="setting-row">
        <div class="setting-label">火价抓取间隔<span>单位：秒</span></div>
        <input type="number" id="cfg_scrape_interval" min="30" max="3600" value="300">
      </div>
      <div class="setting-row">
        <div class="setting-label">物品重载间隔<span>单位：秒</span></div>
        <input type="number" id="cfg_reload_interval" min="30" max="3600" value="300">
      </div>
      <div class="setting-row">
        <div class="setting-label">访问密码<span>用于千岛API鉴权</span></div>
        <input type="password" id="cfg_access_code" placeholder="留空使用默认" value="">
      </div>
    </div>
    <button class="btn btn-primary" onclick="saveSettings()" style="margin-top:8px">保存设置</button>
    <div class="save-msg" id="saveMsg">✓ 设置已保存</div>
  </div>
</div>

<div class="modal-overlay" id="pickerModal">
  <div class="modal">
    <h3>添加到板块</h3>
    <div class="modal-section-list" id="pickerSectionList"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closePicker()">取消</button>
    </div>
  </div>
</div>

<script>
const invoke = (...args) => window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke(...args);

let STATE = {
  firePrice: null,
  rawItems: [],
  sections: [],
  cfg: { mode: '赛季普通', scrape_interval: 300, reload_interval: 300, access_code: '' }
};

let PENDING_ITEM = null;

async function init() {
  try {
    const secs = await apiGetSections();
    STATE.sections = secs || [];
  } catch(e) { STATE.sections = []; }
  try {
    const cfgResp = await apiGetConfig();
    STATE.cfg = cfgResp.input || cfgResp;
    applyCfgToUI();
  } catch(e) {}
  try {
    const r = await apiGetItems();
    STATE.rawItems = r.items || [];
  } catch(e) { STATE.rawItems = []; }
  try {
    STATE.firePrice = await apiGetFirePrice();
  } catch(e) { STATE.firePrice = null; }
  renderFirePriceBadge();
  renderSections();
  setInterval(async () => {
    try {
      STATE.firePrice = await apiGetFirePrice();
      renderFirePriceBadge();
    } catch(e) {}
  }, 300000);
  setInterval(async () => {
    try {
      const r = await apiGetItems();
      STATE.rawItems = r.items || [];
      renderSections();
    } catch(e) {}
  }, 300000);
}
document.addEventListener('DOMContentLoaded', init);

async function apiGetFirePrice() { return await invoke('get_fire_price'); }
async function apiGetItems() { return await invoke('get_items'); }
async function apiGetConfig() { return await invoke('get_config'); }
async function apiSetConfig(cfg) { return await invoke('set_config', { input: cfg }); }
async function apiTriggerScrapeFire() { return await invoke('trigger_scrape_fire'); }
async function apiTriggerItemsReload() { return await invoke('trigger_items_reload'); }
async function apiGetSections() { return await invoke('get_sections'); }
async function apiSaveSections(sections) { return await invoke('save_sections', sections); }
async function apiGetFireHistory(hours) { return await invoke('get_fire_history', { hours }); }
async function apiGetDbStats() { return await invoke('get_db_stats'); }

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.main').forEach(m => m.classList.toggle('hidden', m.id !== 'tab-' + tab));
  if (tab === 'history') loadChart();
}

function renderFirePriceBadge() {
  const badge = document.getElementById('fireBadge');
  const text = document.getElementById('firePriceText');
  const status = document.getElementById('syncStatus');
  let price = null, recordTime = null;
  if (STATE.firePrice) {
    const fp = STATE.firePrice;
    if (fp.price_per_wan !== undefined) {
      price = fp.price_per_wan; recordTime = fp.record_time;
    } else if (fp.ten_k !== undefined) {
      price = fp.ten_k; recordTime = fp.scraped_time || fp.ts || null;
    } else if (fp.data && fp.data.length > 0) {
      const first = fp.data[0];
      price = first.price / 10000; recordTime = first.timestamp;
    }
  }
  if (price !== null) {
    text.textContent = price.toFixed(2) + ' 元/万火';
    badge.classList.remove('loading');
  } else {
    text.textContent = '暂无火价';
    badge.classList.remove('loading');
  }
  if (recordTime) {
    try {
      const d = new Date(recordTime.replace(' ', 'T'));
      if (!isNaN(d)) {
        status.textContent = '已同步 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      }
    } catch(e) { status.textContent = '已同步 ' + recordTime; }
  }
}

async function refreshFirePrice() {
  const badge = document.getElementById('fireBadge');
  badge.classList.add('loading');
  try {
    const r = await apiTriggerScrapeFire();
    if (r && r.ok) STATE.firePrice = await apiGetFirePrice();
  } catch(e) { console.error(e); }
  renderFirePriceBadge();
}

function renderSections() {
  const container = document.getElementById('sectionsContainer');
  if (STATE.sections.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无监控板块</p><button class="btn btn-primary" onclick="addSection()">＋ 添加板块</button></div>';
    return;
  }
  container.innerHTML = STATE.sections.map(sec => buildSectionHTML(sec)).join('');
}

function buildSectionHTML(sec) {
  const totalFire = sec.items.reduce((sum, item) => sum + (parseFloat(item.price) || 0) * (parseInt(item.count) || 1), 0);
  const totalRMB = (STATE.firePrice && STATE.firePrice.price_per_wan) ? (totalFire / 10000) * STATE.firePrice.price_per_wan : 0;

  const itemsHTML = sec.items.map(item => {
    const worth = (item.price / item.more) * 10 <= (sec.damage || 999999);
    const updateTime = item.last_time ? formatHM(item.last_time) : '--:--';
    return '<tr>' +
      '<td class="col-name">' + escapeHtml(item.name) + '</td>' +
      '<td class="col-more">' + item.more + '</td>' +
      '<td class="col-count">' + item.count + '</td>' +
      '<td class="col-fire">' + item.price.toFixed(2) + '</td>' +
      '<td class="col-rmb" style="color:var(--rmb)">≈' + rmbStr(item) + '</td>' +
      '<td class="col-10m">' + tenMfire(item) + '</td>' +
      '<td class="col-worth"><span class="' + (worth ? 'worth-yes' : 'worth-no') + '">' + (worth ? '值' : '不值') + '</span></td>' +
      '<td class="col-time">' + updateTime + '</td>' +
      '<td class="col-action"><button class="delete-btn" onclick="removeItemFromSection(\'' + sec.id + '\',\'' + item.id + '\')">✕</button></td>' +
    '</tr>';
  }).join('');

  const itemOptions = STATE.rawItems.map(it =>
    '<option value="' + it.id + '">' + escapeHtml(it.name) + ' (' + (it.type || '未知') + ')</option>'
  ).join('');

  return '<div class="section-card" id="section-' + sec.id + '">' +
    '<div class="section-header">' +
      '<span class="drag-handle">☰</span>' +
      '<input type="text" class="section-name-input" value="' + escapeHtml(sec.name) + '" onchange="updateSectionName(\'' + sec.id + '\', this.value)">' +
      '<span class="damage-label">基准</span>' +
      '<input type="number" class="damage-input" value="' + (sec.damage || 0) + '" onchange="updateSectionDamage(\'' + sec.id + '\', this.value)" placeholder="基准">' +
      '<span class="section-collapse" onclick="toggleSection(\'' + sec.id + '\')">▼</span>' +
      '<div class="section-actions">' +
        '<button class="btn btn-danger btn-sm" onclick="deleteSection(\'' + sec.id + '\')">删除板块</button>' +
      '</div>' +
    '</div>' +
    '<div class="section-stats">' +
      '<span>总火价: <span class="stat-value stat-fire">' + totalFire.toFixed(2) + '</span></span>' +
      '<span>≈RMB: <span class="stat-value stat-rmb">' + totalRMB.toFixed(2) + ' 元</span></span>' +
      '<span>物品数: <span class="stat-value">' + sec.items.length + '</span></span>' +
    '</div>' +
    '<div class="section-body" id="body-' + sec.id + '">' +
      (sec.items.length > 0 ? '<table class="items-table"><thead><tr>' +
        '<th class="col-name">物品名称</th><th class="col-more">MORE</th><th class="col-count">数量</th>' +
        '<th class="col-fire">火价</th><th class="col-rmb">RMB</th><th class="col-10m">10more/火</th>' +
        '<th class="col-worth">评估</th><th class="col-time">更新时间</th><th class="col-action">删除</th>' +
      '</tr></thead><tbody>' + itemsHTML + '</tbody></table>' :
        '<div style="color:var(--muted);font-size:13px;padding:8px 0">暂无物品，点击下方添加</div>') +
      '<div class="add-item-row">' +
        '<select id="sel-' + sec.id + '">' + (itemOptions || '<option value="">-- 加载中 --</option>') + '</select>' +
        '<input type="number" id="more-' + sec.id + '" placeholder="MORE" min="0" step="0.01">' +
        '<input type="number" id="cnt-' + sec.id + '" placeholder="数量" min="1" value="1">' +
        '<button class="btn btn-primary btn-sm" onclick="addItemToSection(\'' + sec.id + '\')">添加</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function toggleSection(id) {
  const body = document.getElementById('body-' + id);
  const collapse = body.previousElementSibling.querySelector('.section-collapse');
  body.classList.toggle('hidden');
  collapse.classList.toggle('collapsed');
}

function rmbStr(item) {
  if (!STATE.firePrice || !STATE.firePrice.price_per_wan) return '-.--';
  return ((parseFloat(item.price) || 0) / 10000 * STATE.firePrice.price_per_wan * (parseInt(item.count) || 1)).toFixed(2);
}

function tenMfire(item) {
  const p = parseFloat(item.price) || 0, m = parseFloat(item.more) || 1;
  return m === 0 ? '-.--' : ((p / m) * 10).toFixed(4);
}

function formatHM(ts) {
  if (!ts) return '--:--';
  try {
    const d = new Date(ts.replace(' ', 'T'));
    if (isNaN(d)) return ts;
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  } catch(e) { return '--:--'; }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addSection() {
  const id = 'sec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  STATE.sections.push({ id, name: '新板块', damage: 0, items: [] });
  apiSaveSections(STATE.sections).catch(e => console.error(e));
  renderSections();
}

function deleteSection(id) {
  if (!confirm('确认删除该板块？')) return;
  STATE.sections = STATE.sections.filter(s => s.id !== id);
  apiSaveSections(STATE.sections).catch(e => console.error(e));
  renderSections();
}

function updateSectionName(id, name) {
  const sec = STATE.sections.find(s => s.id === id);
  if (sec) { sec.name = name; apiSaveSections(STATE.sections).catch(e => console.error(e)); }
}

function updateSectionDamage(id, damage) {
  const sec = STATE.sections.find(s => s.id === id);
  if (sec) { sec.damage = parseFloat(damage) || 0; apiSaveSections(STATE.sections).catch(e => console.error(e)); renderSections(); }
}

function addItemToSection(secId) {
  const sel = document.getElementById('sel-' + secId);
  const moreInput = document.getElementById('more-' + secId);
  const cntInput = document.getElementById('cnt-' + secId);
  const itemId = sel.value;
  const more = parseFloat(moreInput.value) || 0;
  const count = parseInt(cntInput.value) || 1;
  if (!itemId) { alert('请选择物品'); return; }
  if (more <= 0) { alert('MORE 必须大于 0'); return; }
  const rawItem = STATE.rawItems.find(i => String(i.id) === String(itemId));
  if (!rawItem) { alert('物品未找到'); return; }
  const sec = STATE.sections.find(s => s.id === secId);
  if (!sec) return;
  if (sec.items.some(i => i.id === String(rawItem.id))) { alert('该物品已在此板块中'); return; }
  const newItem = {
    id: String(rawItem.id),
    name: rawItem.name,
    price: parseFloat(rawItem.price) || 0,
    more: more,
    count: count,
    last_time: rawItem.last_time || new Date().toISOString().replace('T',' ').substr(0,16)
  };
  sec.items.push(newItem);
  apiSaveSections(STATE.sections).catch(e => console.error(e));
  renderSections();
}

function removeItemFromSection(secId, itemId) {
  const sec = STATE.sections.find(s => s.id === secId);
  if (sec) {
    sec.items = sec.items.filter(i => i.id !== itemId);
    apiSaveSections(STATE.sections).catch(e => console.error(e));
    renderSections();
  }
}

function doSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if (!query) { results.innerHTML = ''; return; }
  const filtered = STATE.rawItems.filter(it => it.name.toLowerCase().includes(query)).slice(0, 20);
  if (filtered.length === 0) {
    results.innerHTML = '<div class="empty-state"><p>未找到匹配的物品</p></div>';
    return;
  }
  results.innerHTML = filtered.map(it => {
    const rmb = (STATE.firePrice && STATE.firePrice.price_per_wan) ? ((parseFloat(it.price) || 0) / 10000 * STATE.firePrice.price_per_wan).toFixed(2) : '-.--';
    return '<div class="search-result-item" onclick="onSearchResultClick(\'' + it.id + '\', \'' + escapeHtml(it.name).replace(/'/g,"\\'") + '\')">' +
      '<span class="result-name">' + escapeHtml(it.name) + '</span>' +
      '<div class="result-meta">' +
        '<span class="result-type">' + (it.type || '未知') + '</span>' +
        '<span class="result-fire">🔥 ' + (parseFloat(it.price) || 0).toFixed(2) + '</span>' +
        '<span class="result-rmb">≈ ' + rmb + ' 元</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function onSearchResultClick(itemId, itemName) {
  if (STATE.sections.length === 0) {
    addSection();
    setTimeout(() => {
      if (STATE.sections.length > 0) showPickerModal(itemId, itemName);
    }, 50);
  } else if (STATE.sections.length === 1) {
    const sec = STATE.sections[0];
    const rawItem = STATE.rawItems.find(i => String(i.id) === String(itemId));
    if (!rawItem) return;
    if (sec.items.some(i => i.id === String(itemId))) { alert('该物品已在此板块中'); return; }
    const more = parseFloat(prompt('请输入 MORE 值：', '1')) || 1;
    if (more <= 0) return;
    sec.items.push({
      id: String(rawItem.id), name: rawItem.name,
      price: parseFloat(rawItem.price) || 0,
      more: more, count: 1,
      last_time: rawItem.last_time || new Date().toISOString().replace('T',' ').substr(0,16)
    });
    apiSaveSections(STATE.sections).catch(e => console.error(e));
    renderSections();
  } else {
    showPickerModal(itemId, itemName);
  }
}
