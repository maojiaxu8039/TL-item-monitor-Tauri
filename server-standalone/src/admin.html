<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TL Monitor Server - 管理面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header .version {
            opacity: 0.8;
            font-size: 14px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .stat {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
        .stat-value.success { color: #52c41a; }
        .stat-value.error { color: #ff4d4f; }
        .stat-value.warning { color: #faad14; }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
        }
        .table tr:hover {
            background: #f8f9fa;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a6fd6;
        }
        .btn-success {
            background: #52c41a;
            color: white;
        }
        .btn-success:hover {
            background: #3d9a15;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #d93636;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #666;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #eee;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .alert-success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .alert-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .badge-success {
            background: #f6ffed;
            color: #52c41a;
        }
        .badge-error {
            background: #fff2f0;
            color: #ff4d4f;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .refresh-time {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
        .uptime {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .switch-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        .switch-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .switch-item:hover {
            background: #e9ecef;
        }
        .switch-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .switch-item span {
            font-size: 14px;
            color: #495057;
        }
        .reset-table-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }
        .reset-table-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-table-item:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }
        .reset-table-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .reset-table-item span {
            font-size: 13px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TL Monitor Server</h1>
            <div class="version">v<span id="version">-</span></div>
            <div class="uptime">运行时间: <span id="uptime">-</span></div>
        </div>

        <div id="alert-container"></div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('status')">状态</button>
            <button class="tab" onclick="showTab('config')">配置</button>
            <button class="tab" onclick="showTab('export')">导出</button>
        </div>

        <div id="tab-status" class="tab-content active">
            <div class="card">
                <h2>服务器状态</h2>
                <div class="grid" id="stats-grid">
                    <div class="stat">
                        <div class="stat-label">赛季</div>
                        <div class="stat-value" id="stat-season">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">下次采集</div>
                        <div class="stat-value" id="stat-next">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">普通服状态</div>
                        <div class="stat-value" id="stat-normal">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">专家服状态</div>
                        <div class="stat-value" id="stat-expert">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">普通服火价记录</div>
                        <div class="stat-value" id="stat-normal-fire">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">普通服物品记录</div>
                        <div class="stat-value" id="stat-normal-items">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">专家服火价记录</div>
                        <div class="stat-value" id="stat-expert-fire">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">专家服物品记录</div>
                        <div class="stat-value" id="stat-expert-items">-</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>采集详情</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>模式</th>
                            <th>火价</th>
                            <th>物品数</th>
                            <th>采集时间</th>
                            <th>状态</th>
                            <th>错误信息</th>
                        </tr>
                    </thead>
                    <tbody id="collection-tbody">
                        <tr><td colspan="6" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
                <div class="refresh-time">最后更新: <span id="last-update">-</span></div>
            </div>
        </div>

        <div id="tab-config" class="tab-content">
            <div class="card" style="border: 2px solid #4CAF50; background: #f9fff9;">
                <h2>🔐 管理员认证</h2>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="password" id="cfg-password" placeholder="输入管理员密码" style="width: 200px;">
                    <button type="button" class="btn btn-success" onclick="authenticate()">认证</button>
                </div>
                <div id="auth-status" style="margin-top: 10px; font-size: 14px;"></div>
            </div>

            <div class="card">
                <h2>服务器配置</h2>
                <div class="form-group">
                    <label>采集模式开关</label>
                    <div class="switch-group">
                        <label class="switch-item">
                            <input type="checkbox" id="scrape-normal" checked>
                            <span>普通服采集</span>
                        </label>
                        <label class="switch-item">
                            <input type="checkbox" id="scrape-expert">
                            <span>专家服采集</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>season_id</label>
                    <input type="text" id="cfg-season" readonly>
                </div>
                <div class="form-group">
                    <label>HTTP 端口 (重启后生效)</label>
                    <input type="number" id="cfg-port" min="1024" max="65535" readonly>
                </div>
                <form id="config-form">
                    <div class="form-group">
                        <label>CORS 允许的源 (逗号分隔)</label>
                        <input type="text" id="cfg-cors">
                    </div>
                    <div class="form-group">
                        <label>限流配置</label>
                        <select id="cfg-rate-limit">
                            <option value="true">启用</option>
                            <option value="false">禁用</option>
                        </select>
                    </div>
                    <div style="margin-top: 15px;">
                        <button type="button" class="btn btn-secondary" onclick="loadConfig()">加载当前配置</button>
                        <button type="submit" class="btn btn-primary">保存配置</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>火价 API 配置</h2>
                <form id="qiandao-config-form">
                    <div class="grid">
                        <div class="form-group">
                            <label>普通服 Tag ID</label>
                            <input type="text" id="api-qiandao-tag-normal">
                        </div>
                        <div class="form-group">
                            <label>普通服 Spec ID</label>
                            <input type="text" id="api-qiandao-spec-normal">
                        </div>
                        <div class="form-group">
                            <label>专家服 Tag ID</label>
                            <input type="text" id="api-qiandao-tag-expert">
                        </div>
                        <div class="form-group">
                            <label>专家服 Spec ID</label>
                            <input type="text" id="api-qiandao-spec-expert">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">保存火价 API 配置</button>
                </form>
            </div>

            <div class="card">
                <h2>物品 API 配置</h2>
                <form id="luosi-config-form">
                    <div class="grid">
                        <div class="form-group">
                            <label>普通服 season_id</label>
                            <input type="number" id="api-luosi-season-normal">
                        </div>
                        <div class="form-group">
                            <label>专家服 season_id</label>
                            <input type="number" id="api-luosi-season-expert">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">保存物品配置</button>
                </form>
            </div>

            <div class="card" style="border: 2px solid #dc2626; background: #fff5f5;">
                <h2 style="color: #dc2626;">⚠️ 数据库危险操作</h2>
                <div class="danger-warning" style="background: #fee2e2; border: 1px solid #fecaca; border-radius: 6px; padding: 12px; margin-bottom: 15px;">
                    <p style="color: #991b1b; font-size: 13px; margin: 0;">
                        <strong>⚠️ 警告：此操作不可逆！</strong><br>
                        重置表将清空所有数据，但保留表结构。此操作主要用于清理错误数据或重新开始采集。
                    </p>
                </div>
                <div class="form-group">
                    <label>选择赛季</label>
                    <select id="reset-season" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </select>
                </div>
                <div class="form-group">
                    <label>选择要重置的表（可多选）</label>
                    <div class="reset-table-grid">
                        <label class="reset-table-item">
                            <input type="checkbox" id="reset-fire-normal" value="fire_price_snapshots">
                            <span>🔥 火价-普通服</span>
                        </label>
                        <label class="reset-table-item">
                            <input type="checkbox" id="reset-fire-expert" value="fire_price_snapshots">
                            <span>🔥 火价-专家服</span>
                        </label>
                        <label class="reset-table-item">
                            <input type="checkbox" id="reset-items-normal" value="item_snapshots">
                            <span>📦 物品-普通服</span>
                        </label>
                        <label class="reset-table-item">
                            <input type="checkbox" id="reset-items-expert" value="item_snapshots">
                            <span>📦 物品-专家服</span>
                        </label>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <button type="button" class="btn btn-danger" onclick="resetTables()">⚠️ 确认重置选中表</button>
                </div>
            </div>
        </div>

        <div id="tab-export" class="tab-content">
            <div class="card">
                <h2>数据导出</h2>
                <form id="export-form">
                    <div class="grid">
                        <div class="form-group">
                            <label>season_id</label>
                            <select id="export-season">
                                <option value="">当前赛季</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>数据类型</label>
                            <select id="export-type">
                                <option value="fire-history">火价历史</option>
                                <option value="items-history">物品历史</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>服务器模式</label>
                            <select id="export-mode">
                                <option value="normal">普通服</option>
                                <option value="expert">专家服</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>时间范围</label>
                            <select id="export-range">
                                <option value="1">赛季第 1 天</option>
                                <option value="3">赛季前 3 天</option>
                                <option value="7" selected>赛季前 7 天</option>
                                <option value="30">赛季前 30 天</option>
                                <option value="season">整个赛季</option>
                            </select>
                        </div>
                    </div>
                    </form>
                    <div style="margin-top: 15px;">
                        <button type="button" class="btn btn-success" id="btn-export-json">导出 JSON</button>
                        <button type="button" class="btn btn-primary" id="btn-export-csv">导出 CSV</button>
                    </div>
                </div>

                <div class="card">
                    <h2>赛季管理</h2>
                    <div class="form-group">
                        <label>season_id</label>
                        <input type="text" id="season-input" placeholder="例如: ss12">
                    </div>
                    <div class="form-group">
                        <label>赛季名称 (可选)</label>
                        <input type="text" id="season-name-input" placeholder="例如: SS12 赛季">
                    </div>
                    <div class="form-group">
                        <label>开服日期 (必填)</label>
                        <input type="datetime-local" id="season-started-at" placeholder="选择开服日期时间">
                    </div>
                    <div style="margin-top: 15px;">
                        <button type="button" class="btn btn-primary" id="btn-init-season">初始化赛季</button>
                        <button type="button" class="btn btn-danger" id="btn-archive-season">归档赛季</button>
                    </div>
                </div>
            </div>

    <script>
        let serverConfig = null;
        let apiPassword = '';
        let isAuthenticated = false;

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function updateAuthStatus(success, message) {
            const status = document.getElementById('auth-status');
            status.textContent = '';
            const span = document.createElement('span');
            if (success) {
                span.style.color = 'green';
                span.textContent = '✓ 已认证';
                isAuthenticated = true;
            } else {
                span.style.color = 'red';
                span.textContent = '✗ ' + message;
                isAuthenticated = false;
            }
            status.appendChild(span);
        }

        async function authenticate() {
            const password = document.getElementById('cfg-password').value;
            if (!password) {
                updateAuthStatus(false, '请输入密码');
                return;
            }
            try {
                const resp = await fetch('/api/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await resp.json();
                
                if (data.success) {
                    serverConfig = data.data;
                    apiPassword = password;
                    updateAuthStatus(true, '');
                    showAlert('success', '认证成功');
                    loadConfigFields();
                } else {
                    updateAuthStatus(false, data.error || '认证失败');
                    serverConfig = null;
                    apiPassword = '';
                }
            } catch (e) {
                updateAuthStatus(false, e.message);
                serverConfig = null;
                apiPassword = '';
            }
        }

        function loadConfigFields() {
            if (!serverConfig) return;
            document.getElementById('cfg-season').value = serverConfig.season_id;
            document.getElementById('cfg-port').value = serverConfig.http_port;
            document.getElementById('cfg-cors').value = (serverConfig.cors_allowed_origins || []).join(', ');
            document.getElementById('cfg-rate-limit').value = (serverConfig.rate_limit ? serverConfig.rate_limit.enabled : true).toString();

            // Load scrape modes
            if (serverConfig.scrape_modes) {
                const normalMode = serverConfig.scrape_modes.find(m => m.mode === 'normal');
                const expertMode = serverConfig.scrape_modes.find(m => m.mode === 'expert');
                document.getElementById('scrape-normal').checked = normalMode ? normalMode.enabled : true;
                document.getElementById('scrape-expert').checked = expertMode ? expertMode.enabled : false;
            }

            if (serverConfig.api_config) {
                document.getElementById('api-qiandao-tag-normal').value = serverConfig.api_config.qiandao_tag_id_normal || '';
                document.getElementById('api-qiandao-spec-normal').value = serverConfig.api_config.qiandao_spec_id_normal || '';
                document.getElementById('api-qiandao-tag-expert').value = serverConfig.api_config.qiandao_tag_id_expert || '';
                document.getElementById('api-qiandao-spec-expert').value = serverConfig.api_config.qiandao_spec_id_expert || '';
                document.getElementById('api-luosi-season-normal').value = serverConfig.api_config.luosi_season_id_normal || '';
                document.getElementById('api-luosi-season-expert').value = serverConfig.api_config.luosi_season_id_expert || '';
            }
        }

        async function loadConfig() {
            if (!isAuthenticated) {
                showAlert('error', '请先进行管理员认证');
                return;
            }
            if (serverConfig) {
                loadConfigFields();
                showAlert('success', '配置已加载');
            } else {
                showAlert('error', '请先进行管理员认证');
            }
        }

        function getPassword() {
            if (!isAuthenticated || !apiPassword) {
                showAlert('error', '请先进行管理员认证');
                return null;
            }
            return apiPassword;
        }

        function showAlert(type, message) {
            const container = document.getElementById('alert-container');
            container.textContent = '';
            const div = document.createElement('div');
            div.className = 'alert alert-' + type;
            div.textContent = message;
            container.appendChild(div);
            setTimeout(() => { container.textContent = ''; }, 5000);
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function formatUptime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            if (days > 0) return `${days}天 ${hours}小时`;
            if (hours > 0) return `${hours}小时 ${mins}分钟`;
            return `${mins}分钟`;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            return new Date(timestamp * 1000).toLocaleString('zh-CN');
        }

        async function loadStatus() {
            try {
                const resp = await fetch('/api/admin/status');
                const data = await resp.json();
                
                if (data.success) {
                    const info = data.data;
                    document.getElementById('version').textContent = info.version;
                    document.getElementById('uptime').textContent = formatUptime(info.uptime_seconds);
                    document.getElementById('stat-season').textContent = info.season_id;
                    document.getElementById('stat-next').textContent = info.next_collection ? formatTime(info.next_collection) : '-';

                    const normal = info.last_collection.normal;
                    const expert = info.last_collection.expert;

                    console.log('normal:', normal);
                    console.log('expert:', expert);
                    console.log('normal.success:', normal?.success);

                    const statNormal = document.getElementById('stat-normal');
                    statNormal.textContent = '';
                    const badgeNormal = document.createElement('span');
                    badgeNormal.className = normal && normal.is_success ? 'badge badge-success' : 'badge badge-error';
                    badgeNormal.textContent = normal && normal.is_success ? '成功' : '失败';
                    statNormal.appendChild(badgeNormal);

                    const statExpert = document.getElementById('stat-expert');
                    statExpert.textContent = '';
                    const badgeExpert = document.createElement('span');
                    badgeExpert.className = expert && expert.is_success ? 'badge badge-success' : 'badge badge-error';
                    badgeExpert.textContent = expert && expert.is_success ? '成功' : '失败';
                    statExpert.appendChild(badgeExpert);

                    const getDisplayError = (mode) => {
                        if (!mode || !mode.error) return '-';
                        const err = mode.error;
                        if (err.includes('No fire price data')) return '赛季还没开始';
                        if (err.includes('Fire scrape error')) return '火价采集失败';
                        return err;
                    };

                    const tbody = document.getElementById('collection-tbody');
                    tbody.textContent = '';

                    [normal, expert].forEach((mode, idx) => {
                        const modeName = idx === 0 ? '普通服' : '专家服';
                        if (mode) {
                            const row = document.createElement('tr');
                            const cells = [
                                modeName,
                                mode.fire_price?.toFixed(2) || '-',
                                String(mode.items_count || 0),
                                formatTime(mode.timestamp),
                                null, // badge cell
                                getDisplayError(mode),
                            ];
                            cells.forEach((text, i) => {
                                const td = document.createElement('td');
                                if (i === 4) {
                                    const badge = document.createElement('span');
                                    badge.className = mode.is_success ? 'badge badge-success' : 'badge badge-error';
                                    badge.textContent = mode.is_success ? '成功' : '失败';
                                    td.appendChild(badge);
                                } else {
                                    td.textContent = text;
                                }
                                row.appendChild(td);
                            });
                            tbody.appendChild(row);
                        }
                    });

                    if (!normal && !expert) {
                        const row = document.createElement('tr');
                        const td = document.createElement('td');
                        td.colSpan = 6;
                        td.className = 'loading';
                        td.textContent = '暂无采集记录';
                        row.appendChild(td);
                        tbody.appendChild(row);
                    }

                    document.getElementById('last-update').textContent = new Date().toLocaleString('zh-CN');
                }
            } catch (e) {
                console.error('Load status error:', e);
            }

            try {
                const resp = await fetch('/stats');
                const data = await resp.json();
                if (data.success) {
                    const stats = data.data;
                    document.getElementById('stat-normal-fire').textContent = (stats.normal_fire_count || 0) + ' 条';
                    document.getElementById('stat-normal-items').textContent = (stats.normal_items_count || 0) + ' 条';
                    document.getElementById('stat-expert-fire').textContent = (stats.expert_fire_count || 0) + ' 条';
                    document.getElementById('stat-expert-items').textContent = (stats.expert_items_count || 0) + ' 条';
                }
            } catch (e) {
                console.error('Load stats error:', e);
            }
        }

        async function loadConfig() {
            const password = document.getElementById('cfg-password').value;
            if (!password) {
                showAlert('error', '请输入管理员密码');
                return;
            }
            try {
                const resp = await fetch('/api/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await resp.json();
                
                if (data.success) {
                    serverConfig = data.data;
                    document.getElementById('cfg-season').value = serverConfig.season_id;
                    document.getElementById('cfg-port').value = serverConfig.http_port;
                    document.getElementById('cfg-cors').value = (serverConfig.cors_allowed_origins || []).join(', ');
                    document.getElementById('cfg-rate-limit').value = (serverConfig.rate_limit ? serverConfig.rate_limit.enabled : true).toString();

                    if (serverConfig.api_config) {
                        document.getElementById('api-qiandao-tag-normal').value = serverConfig.api_config.qiandao_tag_id_normal || '';
                        document.getElementById('api-qiandao-spec-normal').value = serverConfig.api_config.qiandao_spec_id_normal || '';
                        document.getElementById('api-qiandao-tag-expert').value = serverConfig.api_config.qiandao_tag_id_expert || '';
                        document.getElementById('api-qiandao-spec-expert').value = serverConfig.api_config.qiandao_spec_id_expert || '';
                        document.getElementById('api-luosi-season-normal').value = serverConfig.api_config.luosi_season_id_normal || '';
                        document.getElementById('api-luosi-season-expert').value = serverConfig.api_config.luosi_season_id_expert || '';
                    }
                    showAlert('success', '配置已加载');
                } else {
                    showAlert('error', data.error || '加载配置失败');
                }
            } catch (e) {
                showAlert('error', '加载配置失败: ' + e.message);
            }
        }

        async function loadSeasons() {
            try {
                const resp = await fetch('/seasons');
                const data = await resp.json();
                if (data.success && data.data) {
                    const exportSelect = document.getElementById('export-season');
                    const resetSelect = document.getElementById('reset-season');
                    
                    // 清空现有选项（保留第一个"当前赛季"）
                    while (exportSelect.options.length > 1) {
                        exportSelect.remove(1);
                    }
                    while (resetSelect.options.length > 0) {
                        resetSelect.remove(0);
                    }
                    
                    data.data.forEach(season => {
                        const opt1 = document.createElement('option');
                        opt1.value = season;
                        opt1.textContent = season;
                        exportSelect.appendChild(opt1);
                        
                        const opt2 = document.createElement('option');
                        opt2.value = season;
                        opt2.textContent = season;
                        resetSelect.appendChild(opt2);
                    });
                }
            } catch (e) {
                console.error('Load seasons error:', e);
            }
        }

        async function exportData(format = 'json') {
            const type = document.getElementById('export-type').value;
            const mode = document.getElementById('export-mode').value;
            const rangeSelect = document.getElementById('export-range').value;

            try {
                let min_day = null;
                let max_day = null;

                if (rangeSelect !== 'season') {
                    const days = parseInt(rangeSelect);
                    min_day = 1;
                    max_day = days;
                }

                const seasonParam = document.getElementById('export-season').value ? `&season=${document.getElementById('export-season').value}` : '';
                let dayParams = '';
                if (min_day !== null && max_day !== null) {
                    dayParams = `&min_day=${min_day}&max_day=${max_day}`;
                }

                const endpoint = type === 'fire-history' ? '/fire-history' : '/items-history-all';
                const BATCH_SIZE = 10000;

                showAlert('info', '正在开始导出...');

                const escapeCSV = (val) => {
                    if (val === null || val === undefined) return '';
                    const str = String(val);
                    if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                };

                let allItems = [];
                let offset = 0;
                let exportedCount = 0;
                let hasMore = true;

                while (hasMore) {
                    const batchUrl = `${endpoint}?mode=${mode}&limit=${BATCH_SIZE}&offset=${offset}${seasonParam}${dayParams}`;
                    const resp = await fetch(batchUrl);
                    const data = await resp.json();

                    if (!data.success) {
                        showAlert('error', data.error || '导出失败');
                        return;
                    }

                    const batchItems = data.data || [];
                    if (batchItems.length === 0) {
                        break;
                    }

                    allItems = allItems.concat(batchItems);
                    exportedCount += batchItems.length;
                    showAlert('info', `已获取 ${exportedCount} 条数据...`);

                    if (batchItems.length < BATCH_SIZE) {
                        hasMore = false;
                    } else {
                        offset += BATCH_SIZE;
                    }
                }

                if (allItems.length === 0) {
                    showAlert('error', '没有数据可导出');
                    return;
                }

                showAlert('info', `开始生成文件...`);

                let content, filename, mimeType;
                const BOM = '\uFEFF';

                if (format === 'csv') {
                    if (type === 'fire-history') {
                        const headers = ['赛季天', '火价(RMB/万火)', '每RMB火数', '涨幅', '交易量', '数据时间'];
                        const rows = allItems.map(item => [
                            escapeCSV(item.season_day),
                            escapeCSV(item.rmb_per_10k_fire),
                            escapeCSV(item.fire_per_rmb),
                            escapeCSV(item.increase_ratio),
                            escapeCSV(item.trading_volume),
                            escapeCSV(item.scraped_at ? new Date(item.scraped_at * 1000).toLocaleString('zh-CN') : ''),
                        ].join(','));
                        content = BOM + [headers.join(','), ...rows].join('\n');
                    } else {
                        const headers = ['物品名称', '物品ID', '物品类型', '火价', '赛季天', '抓取时间'];
                        const rows = allItems.map(item => [
                            escapeCSV(item.name),
                            escapeCSV(item.item_id),
                            escapeCSV(item.item_type),
                            escapeCSV(item.fire_price),
                            escapeCSV(item.season_day),
                            escapeCSV(item.scraped_at ? new Date(item.scraped_at * 1000).toLocaleString('zh-CN') : ''),
                        ].join(','));
                        content = BOM + [headers.join(','), ...rows].join('\n');
                    }
                    filename = `tl_${mode}_${type}_${new Date().toISOString().slice(0,10)}.csv`;
                    mimeType = 'text/csv;charset=utf-8';
                } else {
                    content = JSON.stringify(allItems, null, 2);
                    filename = `tl_${mode}_${type}_${new Date().toISOString().slice(0,10)}.json`;
                    mimeType = 'application/json';
                }

                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);

                showAlert('success', `已导出 ${allItems.length} 条数据`);
            } catch (e) {
                showAlert('error', '导出失败: ' + e.message);
            }
        }

        function exportCSV() {
            exportData('csv');
        }

        async function resetTables() {
            const password = getPassword();
            if (!password) return;

            const season_id = document.getElementById('reset-season').value;
            const tables = [];
            const tableTypes = [];

            if (document.getElementById('reset-fire-normal').checked) {
                tables.push('fire_price_snapshots_ss12_normal');
                tableTypes.push({ type: 'fire', mode: 'normal' });
            }
            if (document.getElementById('reset-fire-expert').checked) {
                tables.push('fire_price_snapshots_ss12_expert');
                tableTypes.push({ type: 'fire', mode: 'expert' });
            }
            if (document.getElementById('reset-items-normal').checked) {
                tables.push('item_snapshots_ss12_normal');
                tableTypes.push({ type: 'items', mode: 'normal' });
            }
            if (document.getElementById('reset-items-expert').checked) {
                tables.push('item_snapshots_ss12_expert');
                tableTypes.push({ type: 'items', mode: 'expert' });
            }

            if (tables.length === 0) {
                showAlert('error', '请至少选择一个要重置的表');
                return;
            }

            const tableNames = tables.join(', ');
            if (!confirm(`⚠️ 危险操作确认\n\n即将重置以下表：\n${tableNames}\n\n此操作将清空所有数据，且无法恢复！\n\n输入"重置"确认：`)) return;
            
            const confirmText = prompt('请再次输入"重置"确认此危险操作：');
            if (confirmText !== '重置') {
                showAlert('error', '操作已取消');
                return;
            }

            showAlert('warning', '正在重置表，请稍候...');
            
            let successCount = 0;
            let failCount = 0;
            
            for (const tt of tableTypes) {
                try {
                    const resp = await fetch('/admin/reset-table', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            password,
                            season_id,
                            table_type: tt.type,
                            market_mode: tt.mode
                        })
                    });
                    const data = await resp.json();
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                        showAlert('error', data.error || '重置失败');
                    }
                } catch (e) {
                    failCount++;
                    showAlert('error', '重置失败: ' + e.message);
                }
            }

            if (failCount === 0) {
                showAlert('success', `已成功重置 ${successCount} 个表`);
                // Clear checkboxes
                document.getElementById('reset-fire-normal').checked = false;
                document.getElementById('reset-fire-expert').checked = false;
                document.getElementById('reset-items-normal').checked = false;
                document.getElementById('reset-items-expert').checked = false;
            } else {
                showAlert('error', `成功: ${successCount}，失败: ${failCount}`);
            }
        }

        async function initSeason() {
            const season_id = document.getElementById('season-input').value.trim();
            if (!season_id) {
                showAlert('error', '请输入 season_id');
                return;
            }
            const season_name = document.getElementById('season-name-input').value.trim();
            const password = getPassword();
            if (!password) return;
            
            const started_at_input = document.getElementById('season-started-at').value;
            
            if (!started_at_input) {
                showAlert('error', '请选择开服日期（必填）');
                return;
            }
            
            const started_at = Math.floor(new Date(started_at_input).getTime() / 1000);

            const requestBody = { password, season_id, started_at, season_name };

            try {
                const resp = await fetch('/admin/init-season', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const data = await resp.json();
                if (data.success) {
                    showAlert('success', `赛季 ${season_id} 初始化成功`);
                    loadSeasons();
                } else {
                    showAlert('error', data.error || '初始化失败');
                }
            } catch (e) {
                showAlert('error', '初始化失败: ' + e.message);
            }
        }

        async function archiveSeason() {
            const season_id = document.getElementById('season-input').value.trim();
            if (!season_id) {
                showAlert('error', '请输入 season_id');
                return;
            }
            const password = getPassword();
            if (!password) return;
            if (!confirm(`确定要归档赛季 ${season_id} 吗？`)) return;

            try {
                const resp = await fetch('/admin/archive-season', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, season_id })
                });
                const data = await resp.json();
                if (data.success) {
                    showAlert('success', `赛季 ${season_id} 已归档`);
                } else {
                    showAlert('error', data.error || '归档失败');
                }
            } catch (e) {
                showAlert('error', '归档失败: ' + e.message);
            }
        }

        function addListeners() {
            document.getElementById('btn-export-json').addEventListener('click', () => exportData('json'));
            document.getElementById('btn-export-csv').addEventListener('click', () => exportData('csv'));
            document.getElementById('btn-init-season').addEventListener('click', initSeason);
            document.getElementById('btn-archive-season').addEventListener('click', archiveSeason);

            document.getElementById('config-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = getPassword();
                if (!password) return;
                const config = {
                    password: password,
                    cors_allowed_origins: document.getElementById('cfg-cors').value.split(',').map(s => s.trim()).filter(s => s),
                    rate_limit_enabled: document.getElementById('cfg-rate-limit').value === 'true',
                    scrape_modes: [
                        { mode: 'normal', enabled: document.getElementById('scrape-normal').checked },
                        { mode: 'expert', enabled: document.getElementById('scrape-expert').checked }
                    ]
                };

                try {
                    const resp = await fetch('/api/admin/update-config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    const data = await resp.json();
                    
                    if (data.success) {
                        showAlert('success', '配置已保存，重启后生效');
                    } else {
                        showAlert('error', data.error || '保存失败');
                    }
                } catch (e) {
                    showAlert('error', '保存失败: ' + e.message);
                }
            });

            async function saveApiConfig() {
            const password = getPassword();
            if (!password) return;
            const api_config = {
                qiandao_tag_id_normal: document.getElementById('api-qiandao-tag-normal').value,
                qiandao_spec_id_normal: document.getElementById('api-qiandao-spec-normal').value,
                qiandao_tag_id_expert: document.getElementById('api-qiandao-tag-expert').value,
                qiandao_spec_id_expert: document.getElementById('api-qiandao-spec-expert').value,
                luosi_season_id_normal: parseInt(document.getElementById('api-luosi-season-normal').value) || 0,
                luosi_season_id_expert: parseInt(document.getElementById('api-luosi-season-expert').value) || 0
            };

            try {
                const resp = await fetch('/admin/update-api-config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, api_config })
                });
                const data = await resp.json();
                
                if (data.success) {
                    showAlert('success', '火价API配置已保存，重启后生效');
                } else {
                    showAlert('error', data.error || '保存失败');
                }
            } catch (e) {
                showAlert('error', '保存失败: ' + e.message);
            }
        }

        document.getElementById('qiandao-config-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveApiConfig();
        });

        document.getElementById('luosi-config-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveApiConfig();
        });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                loadStatus();
                loadSeasons();
                setInterval(loadStatus, 30000);
                addListeners();
            });
        } else {
            loadStatus();
            loadSeasons();
            setInterval(loadStatus, 30000);
            addListeners();
        }
    </script>
