version: "3.8"

# 极空间部署：使用已有镜像 + volume 挂载
# - 镜像: ghcr.io/maojiaxu8039/tl-monitor-server:latest (容器内 glibc 2.41)
# - 二进制: 通过 volume 挂载覆盖容器内版本
# - 数据持久化到宿主机

services:
  tl-monitor:
    image: ghcr.io/maojiaxu8039/tl-monitor-server:latest
    container_name: tl-monitor-server
    restart: unless-stopped
    ports:
      - "38457:8080"
    volumes:
      # 数据持久化（与部署文档一致）
      - ./data:/data
      - ./config:/config
      # 覆盖容器内二进制（关键：volume 挂载新版本）
      - ./tl-monitor-server:/tmp/tl-monitor-server
      - ./resources:/resources
    working_dir: /data
    environment:
      - RUST_LOG=info
      - TL_DB_PATH=/data/tl_monitor.db
      - TL_CONFIG_PATH=/config/server_config.yaml
      - TL_RESOURCES_DIR=/resources
      - TL_ADMIN_PASSWORD=${TL_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    stop_grace_period: 30s
    stop_signal: SIGTERM
    command: /tmp/tl-monitor-server
