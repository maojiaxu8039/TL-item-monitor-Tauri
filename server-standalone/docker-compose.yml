services:
  torchscan-server:
    build:
      context: ..
      dockerfile: server-standalone/Dockerfile
    image: torchscan-server:latest
    container_name: torchscan-server
    restart: unless-stopped
    environment:
      TL_ADMIN_PASSWORD: ${TL_ADMIN_PASSWORD:?请在 server-standalone/.env 中设置 TL_ADMIN_PASSWORD}
      TL_CONFIG_PATH: /config/server_config.yaml
      TL_DB_PATH: /data/tl_monitor.db
      TL_RESOURCES_DIR: /app/resources
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${TL_HTTP_PORT:-38457}:8080"
      - "${TL_WS_PORT:-38458}:8081"
    volumes:
      - ./config:/config
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
