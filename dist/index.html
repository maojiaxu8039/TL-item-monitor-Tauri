<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TL物品火价监控</title>
<style>
:root{--bg:#0b0e17;--surface:#13172a;--surface2:#1a2035;--border:#252a40;--fire:#f59e0b;--gold:#fbbf24;--rmb:#34d399;--danger:#f87171;--text:#e2e8f0;--muted:#64748b;--blue:#60a5fa;--green:#34d399;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;min-height:100vh}

.section-dmg-wrap{display:inline-flex;align-items:flex-end;margin-left:40px;gap:3px}
.dmg-label,.dmg-unit{color:var(--rmb);font-size:13px;font-weight:700;white-space:nowrap;font-family:inherit}
.section-damage{background:#12121f;border:1px solid rgba(52,211,153,0.4);color:#fff;font-size:15px;font-weight:700;padding:2px 7px;border-radius:5px;width:50px;text-align:center;outline:none;font-family:inherit}
.section-damage:focus{border-color:var(--rmb);box-shadow:0 0 6px rgba(52,211,153,0.25)}
.section-damage::placeholder{color:rgba(255,255,255,0.25)}
.section-damage{width:70px;padding:2px 6px;background:#1a1a2e;border:1px solid #3a3a5a;border-radius:6px;color:#fff;font-size:12px;text-align:center}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--fire)}
.th-fire-dmg{text-align:left}.td-fire-dmg{text-align:left}
.td-worth{text-align:left!important}
.worth-good{color:#00d2a0!important;font-weight:600;text-align:left}
.th-worth{text-align:left}.worth-bad{color:#ff6b6b!important;font-weight:600;text-align:left}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.header-title{font-size:17px;font-weight:700}
.header-sub{font-size:12px;color:var(--muted)}
.fire-badge{display:flex;align-items:center;gap:6px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;transition:border-color 0.2s}
.fire-badge:hover{border-color:var(--fire)}
.fire-badge .fp{color:var(--fire);font-weight:700;font-size:15px}
.fire-badge .fl{color:var(--muted);font-size:12px}
.fire-input-wrap{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;transition:border-color 0.2s}
.fire-input-wrap:focus-within{border-color:var(--fire)}
.fire-input-wrap input{background:transparent;border:none;outline:none;color:var(--text);width:70px;font-size:15px;font-family:inherit}
.fire-input-wrap span{color:var(--muted);font-size:12px}
.refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.2s}
.refresh-btn:hover{border-color:var(--fire);color:var(--fire)}
.refresh-btn.loading{opacity:0.6;pointer-events:none}
.refresh-btn.loading .btn-text{display:none}
.refresh-btn.loading::before{content:"↻";animation:spin 0.8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.settings-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:15px;cursor:pointer;display:flex;align-items:center;transition:all 0.2s}
.settings-btn:hover{border-color:var(--blue);color:var(--blue)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.total-box{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);border-radius:8px;padding:5px 12px;text-align:right}
.total-box .lbl{font-size:11px;color:var(--muted)}
.total-box .val{font-size:15px;font-weight:700;color:var(--rmb)}
.status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:20px;align-items:center;font-size:12px;color:var(--muted)}
.status-item{display:flex;align-items:center;gap:5px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.status-dot.ok{background:var(--green)}
.status-dot.warn{background:var(--fire)}
.status-dot.off{background:var(--danger)}
.status-val{color:var(--text);font-weight:600}
.settings-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:none;gap:16px;align-items:flex-end;flex-wrap:wrap}
.settings-panel.show{display:flex}
.setting-group{display:flex;flex-direction:column;gap:5px}
.setting-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.setting-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;min-width:160px;transition:border-color 0.2s}
.setting-input:focus{border-color:var(--fire)}
.setting-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;transition:border-color 0.2s}
.setting-toggle{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;transition:all 0.2s}
.setting-toggle.active{border-color:var(--green);background:rgba(52,211,153,0.1)}
.toggle-knob{width:32px;height:18px;background:var(--border);border-radius:9px;position:relative;transition:background 0.2s}
.toggle-knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:white;border-radius:50%;transition:transform 0.2s}
.setting-toggle.active .toggle-knob{background:var(--green)}
.setting-toggle.active .toggle-knob::after{transform:translateX(14px)}
.toggle-label{font-size:13px;color:var(--text)}
.save-btn{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0b0e17;font-weight:700;border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit;transition:opacity 0.2s}
.save-btn:hover{opacity:0.85}
.search-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;gap:10px;align-items:center}
.search-wrap{flex:1;display:flex;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 12px;transition:border-color 0.2s}
.search-wrap:focus-within{border-color:var(--fire)}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:16px;line-height:1}
.search-section{position:relative;flex:1}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-top:4px;max-height:280px;overflow-y:auto;z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.search-dropdown.show{display:block}
.search-result-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.15s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:rgba(245,158,11,0.08)}
.sri-name{font-size:15px;font-weight:500}
.sri-meta{display:flex;gap:12px;align-items:center}
.sri-type{font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 6px;border-radius:4px}
.sri-price{color:var(--fire);font-size:13px;font-weight:600}
.search-hint{padding:12px 14px;color:var(--muted);font-size:13px;text-align:center}
.search-more{padding:10px 14px;text-align:center;color:var(--fire);font-size:13px;cursor:pointer;border-top:1px solid var(--border);transition:background 0.15s}
.search-more:hover{background:var(--surface2)}
.type-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;outline:none;font-family:inherit;cursor:pointer}
.add-btn{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0b0e17;font-weight:700;border-radius:10px;padding:8px 16px;font-size:15px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:opacity 0.2s}
.add-btn:hover{opacity:0.85}
.add-btn:disabled{opacity:0.4;pointer-events:none}
.import-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:border-color 0.2s}
.import-btn:hover{border-color:var(--blue);color:var(--blue)}
.import-btn input{display:none}
.main{padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.section-header{display:flex;align-items:flex-end;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2)}
.section-drag{color:var(--muted);cursor:grab;font-size:16px}
.section-name-wrap{flex:1}
.section-name{background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-weight:700;font-family:inherit;width:100%}
.section-name::placeholder{color:var(--muted)}
.section-stats{display:flex;gap:16px;align-items:flex-end}
.sstat .l{font-size:11px;color:var(--muted)}
.sstat .v{font-size:15px;font-weight:700}
.sstat .v.fire{color:var(--fire)}
.sstat .v.rmb{color:var(--rmb)}
.section-del{background:transparent;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1;transition:all 0.15s}
.section-del:hover{background:rgba(248,113,113,0.1);color:var(--danger)}
.section-add-item{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--fire);font-size:16px;cursor:pointer;padding:3px 8px;border-radius:6px;line-height:1;transition:all 0.15s;font-weight:700}
.section-add-item:hover{background:rgba(245,158,11,0.2);border-color:var(--fire)}
.section-add-item:disabled{opacity:0.35;cursor:not-allowed;pointer-events:none}
.sec-picker-wrap{position:relative}
.sec-picker-btn{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0b0e17;font-weight:700;border-radius:10px;padding:8px 16px;font-size:15px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:opacity 0.2s}
.sec-picker-btn:hover{opacity:0.85}
.sec-picker-btn:disabled{opacity:0.4;cursor:not-allowed}
.sec-picker-dropdown{position:absolute;top:100%;left:0;margin-top:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;min-width:180px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;overflow:hidden}
.sec-picker-dropdown.show{display:block}
.sec-picker-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;font-size:15px;transition:background 0.15s;border-bottom:1px solid var(--border);gap:10px}
.sec-picker-item:last-child{border-bottom:none}
.sec-picker-item:hover{background:rgba(245,158,11,0.1)}
.sec-picker-item .sp-name{flex:1}
.sec-picker-item .sp-count{font-size:12px;color:var(--muted)}
.sp-new{color:var(--fire);font-size:13px;display:flex;align-items:center;gap:5px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--border)}
.sp-new:hover{background:rgba(245,158,11,0.08)}
.section-table{width:100%;border-collapse:collapse}
.section-table th{text-align:left;padding:8px 16px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border);background:var(--surface)}
.section-table td{padding:9px 16px;font-size:13px;border-bottom:1px solid rgba(37,42,64,0.5);vertical-align:middle}
.section-table tr:last-child td{border-bottom:none}
.section-table tr:hover td{background:rgba(255,255,255,0.02)}
.td-name{font-weight:500}
.td-type{font-size:11px;color:var(--muted)}
.td-fire{color:var(--fire);font-weight:600;font-variant-numeric:tabular-nums}
.td-rmb{color:var(--rmb);font-weight:600;font-variant-numeric:tabular-nums}
.td-time{color:var(--muted);font-size:12px}
.td-op .del-item{background:transparent;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;transition:all 0.15s}
.td-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:inherit;padding:3px 6px;width:64px;text-align:center;outline:none;transition:border-color 0.2s}
.td-input:focus{border-color:var(--fire)}
.td-count{width:48px}
.td-op .del-item:hover{color:var(--danger)}
.td-name[data-tip]{cursor:help;border-bottom:1px dashed var(--muted)}
.section-items{display:block}
.section-card.drag-over{border-top:2px solid var(--fire)}
.section-card.drag-under{border-bottom:2px solid var(--fire)}
.section-card.dragging{opacity:0.4}.empty-section{padding:24px;text-align:center;color:var(--muted);font-size:13px}
.load-more-btn{text-align:center;padding:10px;color:var(--fire);font-size:13px;cursor:pointer;background:var(--surface);transition:background 0.15s}
.load-more-btn:hover{background:var(--surface2)}
.section-add-btn{background:transparent;border:2px dashed var(--border);color:var(--muted);border-radius:12px;width:100%;padding:16px;font-size:15px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.section-add-btn:hover{border-color:var(--fire);color:var(--fire)}
.new-section-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;gap:10px;align-items:center}
.new-section-panel input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color 0.2s}
.new-section-panel input:focus{border-color:var(--fire)}
.new-section-panel input::placeholder{color:var(--muted)}
.tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);pointer-events:none;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.4);display:none}
.tooltip.show{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--text);z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.5);transition:opacity 0.3s}
.toast.hide{opacity:0;pointer-events:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* ========== 导入模态框 ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:540px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,0.6);overflow:hidden}
.modal-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface2)}
.modal-header-icon{width:32px;height:32px;background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.modal-header-title{flex:1;font-size:16px;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;transition:all 0.15s}
.modal-close:hover{background:rgba(248,113,113,0.1);color:var(--danger)}
.modal-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface2)}
/* 导入表单区 */
.import-form{display:flex;flex-direction:column;gap:14px}
.import-field{display:flex;flex-direction:column;gap:6px}
.import-field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.modal-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;transition:border-color 0.2s;width:100%}
.modal-select:focus{border-color:var(--fire)}
.import-file-area{display:flex;flex-direction:column;gap:8px}
.import-file-drop{display:flex;align-items:center;gap:10px;background:var(--surface2);border:2px dashed var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all 0.2s;position:relative}
.import-file-drop:hover,.import-file-drop.dragover{border-color:var(--fire);background:rgba(245,158,11,0.05)}
.import-file-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.import-file-icon{width:36px;height:36px;background:rgba(245,158,11,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.import-file-text{flex:1}
.import-file-text .iftitle{font-size:14px;font-weight:500}
.import-file-text .ifhint{font-size:12px;color:var(--muted)}
.import-file-name{margin-top:6px;font-size:13px;color:var(--fire);word-break:break-all}
.import-hint{font-size:12px;color:var(--muted)}
/* 预览区 */
.import-preview{border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:280px;overflow-y:auto}
.import-stat{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}.import-stat-detail{margin-left:auto;font-size:11px;color:var(--muted)}.import-stat-detail span{color:var(--text);font-weight:600}.import-update{font-size:11px;color:var(--fire);white-space:nowrap}
.import-stat span{color:var(--text);font-weight:600}
.import-sec-block{border-bottom:1px solid var(--border)}
.import-sec-block:last-child{border-bottom:none}
.import-sec-hd{padding:8px 14px;background:rgba(245,158,11,0.06);font-size:12px;font-weight:600;color:var(--fire);display:flex;align-items:center;gap:6px}.import-sec-arr{font-size:10px;color:var(--muted);margin-right:4px}.import-sec-name{flex:1}.import-exist-badge{background:rgba(52,211,153,0.15);color:var(--green);font-size:10px;padding:1px 6px;border-radius:10px;font-weight:400}.import-sec-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}.import-sec-items{display:block}.import-meta-num{color:var(--fire);font-weight:600}.import-file-name{font-size:13px;color:var(--fire);word-break:break-all;margin-top:6px;display:block}
.import-sec-hd .match-ratio{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.import-row{display:flex;align-items:center;padding:8px 14px;gap:8px;border-bottom:1px solid rgba(37,42,64,0.5);font-size:13px}
.import-row:last-child{border-bottom:none}
.import-row .item-name{flex:1;font-weight:500}
.import-row .item-meta{font-size:11px;color:var(--muted);display:flex;gap:8px}
.import-row .item-meta span{background:var(--surface2);padding:1px 6px;border-radius:4px}
.import-ok{font-size:11px;color:var(--green);white-space:nowrap}
.import-miss{font-size:11px;color:var(--danger);white-space:nowrap}
/* 结果提示 */
.import-result{padding:10px 14px;border-radius:8px;font-size:13px;text-align:center}
.import-result.success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);color:var(--green)}
.import-result.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--danger)}
/* 按钮 */
.btn-import-file{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0b0e17;font-weight:700;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity 0.2s;flex-shrink:0}
.btn-import-file:hover{opacity:0.85}
.btn-download-template{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:13px;text-decoration:none;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:5px}
.btn-download-template:hover{border-color:var(--blue);color:var(--blue)}
.btn-confirm-import{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;color:#0b0e17;font-weight:700;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;font-family:inherit;transition:opacity 0.2s}
.btn-confirm-import:hover{opacity:0.85}

<body>


<div class="header">
  <img src="logo.png" class="header-icon" style="width:36px;height:36px;border-radius:8px;object-fit:contain;background:transparent;" alt="logo">
  <div><div class="header-title">火炬之光物品策略</div><div class="header-sub" id="statusMode">赛季普通 · 5分钟自动抓取</div></div>
  <div class="fire-badge" onclick="openFireHistoryModal()" title="点击查看火价走势"><span class="fp" id="fpDisplay">--</span><span class="fl">元/万火</span></div>
  <div class="fire-input-wrap" title="手动输入火价"><span>🔥</span><input type="number" id="fpInput" placeholder="100" min="1" step="0.01"><span>元/万火</span></div>
  <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()"><span class="btn-text">↻ 刷新</span></button>
  <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()" title="设置">⚙</button>
  <div class="header-right">
    <div class="total-box"><div class="lbl">总火价</div><div class="val" id="grandFire">--</div></div>
    <div class="total-box"><div class="lbl">总 RMB</div><div class="val" id="grandRmb">--</div></div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="setting-group">
    <div class="setting-label">火价抓取模式</div>
    <select class="setting-select" id="cfgMode"><option value="赛季普通">赛季普通</option><option value="赛季专家">赛季专家</option></select>
  </div>
  <div class="setting-group">
    <div class="setting-label">抓取间隔（秒）</div>
    <input type="number" class="setting-input" id="cfgScrapeInterval" min="60" max="3600" value="300">
  </div>
  <div class="setting-group">
    <div class="setting-label">自动抓取</div>
    <div class="setting-toggle active" id="cfgScrapeToggle" onclick="toggleScrape()"><div class="toggle-knob"></div><span class="toggle-label" id="scrapeToggleLabel">开启</span></div>
  </div>
  <div class="setting-group" style="flex:1;">
    <div class="setting-label">物品数据库路径</div>
    <input type="text" class="setting-input" id="cfgJsonPath" placeholder="粘贴完整路径" style="width:100%;">
  </div>
  <div class="setting-group">
    <div class="setting-label">重载间隔（秒）</div>
    <input type="number" class="setting-input" id="cfgReloadInterval" min="60" max="3600" value="300">
  </div>
  <div class="setting-group">
    <div class="setting-label">自动重载</div>
    <div class="setting-toggle active" id="cfgReloadToggle" onclick="toggleReload()"><div class="toggle-knob"></div><span class="toggle-label" id="reloadToggleLabel">开启</span></div>
  </div>
  <button class="save-btn" onclick="saveSettings()">保存配置</button>
</div>

<div class="status-bar" id="statusBar">
  <div class="status-item"><div class="status-dot ok" id="dotFire"></div><span>火价</span><span class="status-val" id="lastFireTime">--</span></div>
  <div class="status-item"><div class="status-dot ok" id="dotItems"></div><span>物品库</span><span class="status-val" id="lastItemsTime">--</span></div>
  <div class="status-item"><span>模式:</span><span class="status-val" id="cfgModeDisplay">专家</span></div>
  <div class="status-item"><span>物品数据库路径:</span><span class="status-val" id="cfgPathDisplay">内置</span></div>
  <div class="status-item"><span>🖥️</span><span class="status-val" id="notifBadge">弹窗监控:检测中</span></div>
  <div class="status-item"><span>🗄️</span><span class="status-val" id="dbStatus">数据库:--</span></div>
</div>

<div class="search-bar">
  <div class="search-section">
    <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="输入物品名称搜索…" autocomplete="off"></div>
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>
  <select class="type-select" id="typeFilter" onchange="_typeFilterSearch()"><option value="">全类型</option><option value="暗金">暗金</option><option value="技能">技能</option><option value="通货">通货</option><option value="天命">天命</option><option value="触媒">触媒</option><option value="罗盘">罗盘</option><option value="门票">门票</option><option value="卡片">卡片</option></select>
  <div class="sec-picker-wrap"><button class="sec-picker-btn" id="addSelBtn" onclick="openImportModal()">导入列表</button></div>
  <button class="sec-picker-btn" onclick="exportList()">导出列表</button>
</div>

<div class="main" id="mainContent"></div>

<div class="main">
  <button class="section-add-btn" onclick="showNewSection()">＋ 新建板块</button>
  <div class="new-section-panel" id="newSectionPanel" style="display:none;margin-top:12px;">
    <input type="text" id="newSectionName" placeholder="输入板块名称" maxlength="20">
    <button class="add-btn" onclick="createSection()">创建</button>
    <button class="import-btn" style="border-color:var(--danger);color:var(--danger)" onclick="hideNewSection()">取消</button>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="toast hide" id="toast"></div>

<script>window._jsVersion="v7";
var STATE={firePrice:100,rawItems:[],sections:[],selectedItem:null,searchResults:[],searchVisibleCount:15,sectionVisibleItems:{},_dirty:null,cfg:{mode:"赛季普通",scrape_enabled:true,scrape_interval:300,items_path:"",auto_reload:true,reload_interval:300,last_fire_scrape:"",last_items_reload:""}};
var NOTIFIED_IDS=[];
var _nfCache={};
var FS=function(n,d){
  var k=d||2;
  if(!_nfCache[k])_nfCache[k]=new Intl.NumberFormat("zh-CN",{minimumFractionDigits:k,maximumFractionDigits:k});
  return _nfCache[k].format(parseFloat(n)||0);
};
var RMB=function(fire){return fire*STATE.firePrice/10000};
var fmtRmb=function(v){return "¥"+FS(v,2)};
var fmtFire=function(v){return FS(v,1)+"火"};
var fmtT=function(ts){return ts?new Date(ts*1000).toLocaleString("zh-CN"):"—"};
function renderSearchResults(){}
function loadMoreSearchResults(){
  var results=STATE.searchResults||[];
  var visible=STATE.searchVisibleCount||15;
  visible+=15;
  STATE.searchVisibleCount=visible;
  var shown=results.slice(0,visible);
  var dd=document.getElementById("searchDropdown");
  var html=shown.map(function(item){
    var id=escAttr(item.item_id||item.物品ID||item.name);
    return"<div class=\"search-result-item\" data-item-id=\""+id+"\" onclick=\"selectItem(this.dataset.itemId)\"><div><div class=\"sri-name\">"+escHtml(item.name)+"</div><div class=\"sri-meta\"><span class=\"sri-type\">"+escHtml(item.type||"")+"</span></div></div><div style=\"display:flex;align-items:center;gap:10px;\"><span class=\"sri-price\">"+fmtFire(item.price||0)+"</span></div></div>"
  }).join("");
  if(results.length>visible){
    html+="<div class=\"search-more\" onclick=\"loadMoreSearchResults()\">还有 "+(results.length-visible)+" 个结果，点击加载更多</div>";
  }
  dd.innerHTML=html;
}
async function init(){
  loadSections();
  try{await loadConfig()}catch(e){}
  try{await fetchItems()}catch(e){}
  try{await fetchFirePrice()}catch(e){}
  renderAll();
  // 请求通知权限（仅首次）
  // 弹窗监控系统状态显示
  var badge=document.getElementById("notifBadge");
  if(badge){
    badge.textContent="弹窗监控:运行中";
    badge.style.color="var(--green)";
  }
  // 每30秒检测一次评估=good的物品
  setInterval(checkWorthNotifications,30000);
  // 每30秒轮询服务器，火价和物品数据有变化时自动更新
  setInterval(pollServerUpdates,30000);
  // 初始化轮询基准值
  _lastFirePrice=STATE.firePrice||0;
  _lastItemsCount=STATE.rawItems.length||0;
}



function loadSections(){try{var d=localStorage.getItem("tl_sections");if(d){STATE.sections=JSON.parse(d)}else{if(!STATE.sections.length)STATE.sections.push({id:Date.now(),name:"我的关注",damage:0,items:[]})}}catch(e){STATE.sections=[{id:Date.now(),name:"我的关注",damage:0,items:[]}]}
  // 默认按10more/火升序排列
  STATE.sections.forEach(function(sec){sortItems(sec.id,'fireDmg','asc')})}
function saveSections(){try{localStorage.setItem("tl_sections",JSON.stringify(STATE.sections))}catch(e){}}

async function loadConfig(){
  try{var r=await fetch("/api/config");var d=await r.json();STATE.cfg=d;applyConfigToUI();updateStatusBar();document.getElementById("statusMode").textContent=STATE.cfg.mode+" · "+(STATE.cfg.scrape_enabled?Math.round(STATE.cfg.scrape_interval/60)+"分钟自动抓取":"手动")}
  catch(e){console.error("config load failed",e)}
}

function applyConfigToUI(){
  var c=STATE.cfg;
  document.getElementById("cfgMode").value=c.mode;
  document.getElementById("cfgScrapeInterval").value=c.scrape_interval;
  document.getElementById("cfgJsonPath").value=c.items_path||"";
  document.getElementById("cfgReloadInterval").value=c.reload_interval;
  var st=document.getElementById("cfgScrapeToggle");
  var rt=document.getElementById("cfgReloadToggle");
  if(c.scrape_enabled){st.classList.add("active");document.getElementById("scrapeToggleLabel").textContent="开启"}
  else{st.classList.remove("active");document.getElementById("scrapeToggleLabel").textContent="关闭"}
  if(c.auto_reload){rt.classList.add("active");document.getElementById("reloadToggleLabel").textContent="开启"}
  else{rt.classList.remove("active");document.getElementById("reloadToggleLabel").textContent="关闭"}
}

function showDbg(msg){};
function updateStatusBar(){
  var c=STATE.cfg;
  document.getElementById("cfgModeDisplay").textContent=c.mode;
  document.getElementById("cfgPathDisplay").textContent=c.items_path?c.items_path:"内置";
  document.getElementById("lastFireTime").textContent=c.last_fire_scrape||"--";
  document.getElementById("lastItemsTime").textContent=c.last_items_reload||"--";
  var df=document.getElementById("dotFire");
  if(c.last_fire_scrape){var t=new Date(c.last_fire_scrape);var age=(Date.now()-t)/1000;df.className="status-dot "+(age<600?"ok":age<1800?"warn":"off")}
  // 数据库状态
  var ds=document.getElementById("dbStatus");
  fetch("/api/db/stats").then(r=>r.json()).then(d=>{
    if(d.item_count!==undefined){
      ds.textContent="数据库:"+d.item_count+"物品/"+d.log_count+"记录";
      ds.style.color="var(--green)";
    }
  }).catch(function(){ds.textContent="数据库:未连接";ds.style.color="var(--red)"});
}

function toggleSettings(){document.getElementById("settingsPanel").classList.toggle("show")}
function toggleScrape(){
  var t=document.getElementById("cfgScrapeToggle");
  var l=document.getElementById("scrapeToggleLabel");
  t.classList.toggle("active");
  l.textContent=t.classList.contains("active")?"开启":"关闭"
}
function toggleReload(){
  var t=document.getElementById("cfgReloadToggle");
  var l=document.getElementById("reloadToggleLabel");
  t.classList.toggle("active");
  l.textContent=t.classList.contains("active")?"开启":"关闭"
}
async function saveSettings(){
  var newCfg={
    fire_price:{mode:document.getElementById("cfgMode").value,scrape_interval:parseInt(document.getElementById("cfgScrapeInterval").value),scrape_enabled:document.getElementById("cfgScrapeToggle").classList.contains("active")},
    items:{json_path:document.getElementById("cfgJsonPath").value,reload_interval:parseInt(document.getElementById("cfgReloadInterval").value),auto_reload:document.getElementById("cfgReloadToggle").classList.contains("active")}
  };
  try{
    var r=await fetch("/api/set-config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(newCfg)});
    var d=await r.json();
    if(d.status=="ok"){
      STATE.cfg.mode=newCfg.fire_price.mode;
      STATE.cfg.scrape_interval=newCfg.fire_price.scrape_interval;
      STATE.cfg.items_path=newCfg.items.json_path;
      STATE.cfg.reload_interval=newCfg.items.reload_interval;
      STATE.cfg.scrape_enabled=newCfg.fire_price.scrape_enabled;
      STATE.cfg.auto_reload=newCfg.items.auto_reload;
      if(d.warning){
        toast(d.warning);
      } else{
        toast("配置已保存");
      }
    } else{toast("保存失败："+d.message)}
  } catch(e){toast("⚠️ 配置保存失败，请检查网络或服务器")}
  document.getElementById("settingsPanel").classList.remove("show");
  updateStatusBar();
  fetchItems();
  document.getElementById("statusMode").textContent=STATE.cfg.mode+" · "+(STATE.cfg.scrape_enabled?Math.round(STATE.cfg.scrape_interval/60)+"分钟自动抓取":"手动");
}

async function fetchFirePrice(){
  try{
    var r=await fetch("/api/fire-price",{cache:"no-store"});
    if(!r.ok){var dot=document.getElementById("dotFire");if(dot)dot.className="status-dot warn";document.getElementById("lastFireTime").textContent="加载失败";return}
    var d=await r.json();
    STATE.cfg.last_fire_scrape=d.record_time||new Date().toLocaleString("zh-CN");
    STATE.firePrice=parseFloat(d.price_per_wan)||STATE.firePrice;
    document.getElementById("fpDisplay").textContent=FS(STATE.firePrice,2);
    document.getElementById("fpInput").value=STATE.firePrice;
    var dot=document.getElementById("dotFire");if(dot)dot.className="status-dot ok";
    document.getElementById("lastFireTime").textContent=STATE.cfg.last_fire_scrape;
    _lastFirePrice=STATE.firePrice||0;
  }catch(e){var dot=document.getElementById("dotFire");if(dot)dot.className="status-dot warn";document.getElementById("lastFireTime").textContent="加载失败"}
}



async function refreshAll(){
  var btn=document.getElementById("refreshBtn");
  btn.classList.add("loading");
  try{
    var r=await fetch("/api/scrape-fire?sync=1",{cache:"no-store"});
    var d=await r.json();
    if(!d.ok){toast(d.message||"火价刷新失败");} else {
      STATE.firePrice=parseFloat(d.price_per_wan)||STATE.firePrice;
      STATE.cfg.last_fire_scrape=d.record_time||new Date().toLocaleString("zh-CN");
      document.getElementById("fpDisplay").textContent=FS(STATE.firePrice,2);
      document.getElementById("fpInput").value=STATE.firePrice;
      document.getElementById("lastFireTime").textContent=STATE.cfg.last_fire_scrape;
      var dotF=document.getElementById("dotFire");if(dotF)dotF.className="status-dot ok";
      toast("火价已刷新: "+d.price_per_wan);
    }
  }catch(e){var dotF=document.getElementById("dotFire");if(dotF)dotF.className="status-dot warn";toast("火价刷新失败，请检查网络")}
  try{
    var r2=await fetch("/api/items",{cache:"no-store"});
    var d2=await r2.json();
    STATE.rawItems=d2.items||[];
    STATE.cfg.last_items_reload=new Date().toLocaleString("zh-CN");
    var dotI=document.getElementById("dotItems");if(dotI)dotI.className="status-dot ok";
    if(d2.count!==_lastItemsCount){_lastItemsCount=d2.count;renderAll()}
    toast("JSON已更新: "+(d2.count||0)+" 条物品")
  }catch(e){var dotI=document.getElementById("dotItems");if(dotI)dotI.className="status-dot warn";toast("物品库加载失败，请检查网络")}
  btn.classList.remove("loading");
  updateStatusBar();
  if(d2.count!==_lastItemsCount){_lastItemsCount=d2.count;renderAll()}
}


async function fetchItems(){
  try{
    var r=await fetch("/api/items",{cache:"no-store"});
    if(!r.ok){var _e=document.getElementById("dotItems");if(_e)_e.className="status-dot warn";document.getElementById("lastItemsTime").textContent="加载失败";toast("物品库加载失败，请检查服务器");return}
    var d=await r.json();
    STATE.rawItems=d.items||[];
    _itemsLoaded=true;
    _lastItemsCount=d.count||0;
    STATE.cfg.last_items_reload=new Date().toLocaleString("zh-CN");
    // 启动时同步板块物品价格（匹配 r.id 字段）
    STATE.sections.forEach(function(sec){
      sec.items.forEach(function(it){
        var db=STATE.rawItems.find(function(r){return r.id===it.id||r.item_id===it.id||r.物品ID===it.id||r.name===it.name});
        if(db){it.price=parseFloat(db.price)||0;it.last_time=db.last_time||null}
      });
    });
    var dot=document.getElementById("dotItems");if(dot)dot.className="status-dot ok";
    updateStatusBar()
  }catch(e){var dot=document.getElementById("dotItems");if(dot)dot.className="status-dot warn";document.getElementById("lastItemsTime").textContent="加载失败";toast("物品库加载失败，请检查网络")}
}

// 每30秒轮询服务器，火价或物品数据有变化时自动更新页面
async function pollServerUpdates(){
  try{
    // 检查火价是否有变化
    var fr=await fetch("/api/fire-price",{cache:"no-store"});
    if(fr.ok){
      var fd=await fr.json();
      var newPrice=parseFloat(fd.price_per_wan)||0;
      if(newPrice&&newPrice!==_lastFirePrice){
        STATE.firePrice=newPrice;
        STATE.cfg.last_fire_scrape=fd.record_time||new Date().toLocaleString("zh-CN");
        document.getElementById("fpDisplay").textContent=FS(STATE.firePrice,2);
        document.getElementById("fpInput").value=STATE.firePrice;
        document.getElementById("lastFireTime").textContent=STATE.cfg.last_fire_scrape;
        var dot=document.getElementById("dotFire");if(dot)dot.className="status-dot ok";
        _lastFirePrice=newPrice;
      }
    }
  }catch(e){}
  try{
    // 检查物品数据是否有变化
    var ir=await fetch("/api/items",{cache:"no-store"});
    if(ir.ok){
      var id=await ir.json();
      var newCount=id.count||0;
      STATE.rawItems=id.items||[];
      var updated=false;
      // 同步各板块的物品价格（每次轮询都检查）
      STATE.sections.forEach(function(sec){
        sec.items.forEach(function(it){
          var db=STATE.rawItems.find(function(r){return r.id===it.id||r.item_id===it.id||r.物品ID===it.id||r.name===it.name});
          if(db){
            var newPrice=parseFloat(db.price)||0;
            if(newPrice!==it.price){
              it.price=newPrice;
              it.last_time=db.last_time||null;
              updated=true;
            }
          }
        });
      });
      _lastItemsCount=newCount;
      STATE.cfg.last_items_reload=new Date().toLocaleString("zh-CN");
      var dot=document.getElementById("dotItems");if(dot)dot.className="status-dot ok";
      document.getElementById("lastItemsTime").textContent=STATE.cfg.last_items_reload;
      if(updated){
        saveSections();
        renderAll(false);
        checkWorthNotifications();
      }
    }
  }catch(e){}
}

document.getElementById("fpInput").addEventListener("change",function(){
  if(this.value&&this.value>0){
    STATE.firePrice=parseFloat(this.value);
    document.getElementById("fpDisplay").textContent=FS(STATE.firePrice,2);
    _updateAllFirePrices();
  }
});

function exportList(){
  var lines=["板块名称,物品名称,MORE,数量"];
  STATE.sections.forEach(function(sec){
    sec.items.forEach(function(item){
      lines.push(escHtml(sec.name)+","+escHtml(item.name)+","+(item.more||0)+","+(item.count||1))
    })
  })
  var csv=lines.join("\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="tl_items_"+new Date().toISOString().slice(0,10)+".csv";a.click();
  URL.revokeObjectURL(url)
}

function importJSON(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var newItems=Array.isArray(data)?data:Object.values(data);
      var lookup={};
      newItems.forEach(function(item){var k=item.item_id||item.物品ID||item.name;if(k)lookup[k]=item});
      var updatedCount=0;
      STATE.sections.forEach(function(sec){
        sec.items.forEach(function(secItem){
          var found=lookup[secItem.id];
          if(found){
            var newPrice=parseFloat(found.price)||0;
            if(newPrice!==secItem.price){secItem.price=newPrice;updatedCount++}
            if(found.last_time)secItem.last_time=found.last_time
          }
        })
      });
      STATE.rawItems=newItems;
      saveSections();
      renderAll();
      var totalMsg="成功导入 "+newItems.length+" 条物品";
      var updateMsg=updatedCount>0?"，其中板块内 "+updatedCount+" 件价格已更新":"（板块物品价格无变化）";
      toast(totalMsg+updateMsg)
    }catch(err){toast("JSON解析失败："+err.message)}
  };
  reader.readAsText(file);
  e.target.value=""
}

function doSearch(){
  var q=document.getElementById("searchInput").value.trim().toLowerCase();
  var type=document.getElementById("typeFilter").value;
  var dd=document.getElementById("searchDropdown");
  if(!q&&!type){dd.classList.remove("show");return}
  var results=STATE.rawItems.filter(function(item){
    var name=(item.name||"").toLowerCase();
    var t=item.type||"";
    return(!q||name.includes(q))&&(!type||t===type)
  });
  STATE.searchResults=results.slice(0,200); // 最多保留200条
  STATE.searchVisibleCount=15; // 初始显示15条
  dd.classList.add("show");
  STATE.selectedItem=null;

  var visible=STATE.searchVisibleCount||15;
  if(!STATE.searchResults.length){
    dd.innerHTML='<div class="search-hint">未找到匹配物品</div>';
    STATE.selectedItem=null;

    return
  }
  var shown=STATE.searchResults.slice(0,visible);
  var html=shown.map(function(item){
    var id=escAttr(item.item_id||item.物品ID||item.name);
    return'<div class="search-result-item" onclick="selectItem(\''+id+'\')"><div><div class="sri-name">'+escHtml(item.name)+'</div><div class="sri-meta"><span class="sri-type">'+escHtml(item.type||"")+'</span></div></div><div style="display:flex;align-items:center;gap:10px;"><span class="sri-price">'+fmtFire(item.price||0)+'</span></div></div>'
  }).join("");
  if(results.length>visible){
    html+='<div class="search-more" onclick="loadMoreSearchResults()">还有 '+(results.length-visible)+' 个结果，点击加载更多</div>';
  }
  dd.innerHTML=html;
  STATE.selectedItem=null;
}

function _updateAllFirePrices(){
  STATE.sections.forEach(function(sec){
    var secEl=document.querySelector('[data-sec-id="'+sec.id+'"]');
    if(!secEl)return;
    // Update section header stats
    var totalFire=sec.items.reduce(function(a,i){return a+calcItemFire(i)},0);

      if(dc)dc.textContent=fmtFireDmg(item,if2);
      if(wc)wc.textContent=fmtWorth(item,sec.damage);
    });
  });
  _updateGrandTotal();
}

function renderAll(full){
  if(full===undefined)full=(STATE._dirty===null);
  if(!full){
    // 局部更新：只重渲染目标板块
    var secId=STATE._dirty;
    STATE._dirty=null;
    var sec=STATE.sections.find(function(s){return String(s.id)===String(secId)});
    if(!sec)return;
    var oldEl=document.querySelector('[data-sec-id="'+secId+'"]');
    if(oldEl){
      var wrapper=document.createElement('div');
      wrapper.innerHTML=_buildSectionHtml(sec);
      oldEl.parentNode.replaceChild(wrapper.firstElementChild,oldEl);
    }
    // 更新总计
    var gf=STATE.sections.reduce(function(s,sec){return s+sec.items.reduce(function(a,i){return a+calcItemFire(i)},0)},0);
    document.getElementById("grandFire").textContent=fmtFire(gf);
    document.getElementById("grandRmb").textContent=fmtRmb(RMB(gf));
    var hasSel=!!STATE.selectedItem;
    STATE.sections.forEach(function(sec){var btn=document.getElementById("sapBtn"+sec.id);if(btn)btn.disabled=!hasSel});
    return;
  }
  // 全量渲染
  var main=document.getElementById("mainContent");
  main.innerHTML=STATE.sections.map(_buildSectionHtml).join("");
  checkWorthNotifications();
  var gf=STATE.sections.reduce(function(s,sec){return s+sec.items.reduce(function(a,i){return a+calcItemFire(i)},0)},0);
  document.getElementById("grandFire").textContent=fmtFire(gf);
  document.getElementById("grandRmb").textContent=fmtRmb(RMB(gf));
  var hasSel=!!STATE.selectedItem;
  STATE.sections.forEach(function(sec){var btn=document.getElementById("sapBtn"+sec.id);if(btn)btn.disabled=!hasSel});
}

function _typeEmoji(type){
  var map={'技能':'💫','天命':'⭐','传奇装备':'⚡','通货':'🪙','罗盘':'🧭','触媒':'💎','门票':'🎫','卡片':'🃏','棱镜':'🔷','探针':'📍'};
  return map[type]||'📦';
}
function checkWorthNotifications(){
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  var pending=[];
  STATE.sections.forEach(function(sec){
    sec.items.forEach(function(item){
      if(NOTIFIED_IDS.indexOf(item.id)>=0)return;
      var p=item.price||0;
      if(!p||sec.damage==null||sec.damage===undefined)return;
      // 触发条件与界面「值/不值」一致：每10more的火价 <= 板块damage 则为值
      var more = item.more || 0;
      if(!p || more === 0 || sec.damage == null || sec.damage === undefined) return;
      var actual_damage = p / (more / 10); // 每10more = X火
      var R2 = sec.damage;
      if(actual_damage <= R2){
        NOTIFIED_IDS.push(item.id);
        var fireVal = calcItemFire(item);
        var fireDmg = more > 0 ? (p / (more / 10)).toFixed(2) : '0.00';
        var updateTime = item.last_time ? new Date(item.last_time*1000).toLocaleString('zh-CN') : '无';
        pending.push({
          name: item.name,
          type: item.type||'',
          fire: fmtFire(fireVal),
          fireDmg: fireDmg,
          last_time: updateTime
        });
      }
    });
  });
  pending.forEach(function(item,idx){
    setTimeout(function(){
      // new Notification('火炬超值: '+item.name,{
      //   body:'物品名称：'+item.name+'\n火价：'+item.fire+'\n百火/伤害：'+item.fireDmg+'\n更新时间：'+item.last_time,
      //   silent:false
      // });
      // 调用服务端 API 触发原生系统通知（Win/macOS）
      var msg='物品名称：'+item.name+'\n火价：'+item.fire+'\n10more/火：'+item.fireDmg+'\n更新时间：'+item.last_time;
      fetch('/api/notify?title='+encodeURIComponent('火炬超值')+'&message='+encodeURIComponent(msg)+'&icon=logo.ico').catch(function(){});
    },idx*20000);
  });
}

  var el=document.getElementById("sec-items-"+secId);

function updateItemField(secId,itemId,field,value){
  var _field=typeof field==="number"?("more count".split(" ")[field-1]||field):field;
  var sec=STATE.sections.find(function(s){return Number(s.id)===Number(secId)});
  if(!sec){console.warn("sec not found",secId);return}
  var item=sec.items.find(function(i){return String(i.id)===String(itemId)});
  if(!item){console.warn("item not found",itemId);return}
  if(_field==="more"){item.more=parseFloat(value)||0}
  else if(_field==="count"){item.count=Math.max(1,parseInt(value)||1)}
  else return;
  saveSections();
  STATE._dirty=secId;renderAll(false);
}

function showTooltip(e,el){
  var tip=document.getElementById("tooltip");
  tip.textContent=el.dataset.tip||"";
  tip.classList.add("show");

  tip.style.left=rect.left+"px";
  tip.style.top=(rect.bottom+4)+"px"
}
function hideTooltip(){document.getElementById("tooltip").classList.remove("show")}

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.remove("hide");
  clearTimeout(t._timer);

var _hist={chart:null,itemId:null,itemName:null,secId:null,hours:24};

function openHistoryModal(itemId,secId,itemName){
  _hist.itemId=itemId;_hist.itemName=itemName;_hist.secId=secId;_hist.hours=24;
  document.querySelectorAll('.m-tab').forEach(function(b){b.classList.remove('active')});
  document.querySelector('.m-tab').classList.add('active');
  document.getElementById('historyModalTitle').textContent='📊 '+itemName;
  document.getElementById('historyChartWrap').style.display='block';
  document.getElementById('historyEmpty').style.display='none';
  document.getElementById('historyModal').style.display='flex';
  fetchHistoryAndDraw();
}

function closeHistoryModal(){
  document.getElementById('historyModal').style.display='none';
  if(_hist.chart){_hist.chart.destroy();_hist.chart=null}
}

function setHistoryRange(hours,btn){
  document.querySelectorAll('.m-tab').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  _hist.hours=hours;
  fetchHistoryAndDraw();
}

function fetchHistoryAndDraw(){
  var itemId=_hist.itemId;
  var mode=STATE.cfg&&STATE.cfg.mode||'赛季普通';
  var url='/api/db/fire-history?item_id='+encodeURIComponent(itemId)+'&hours='+_hist.hours+'&mode='+encodeURIComponent(mode);
  fetch(url)
    .then(function(r){return r.json()})
    .then(function(d){drawHistoryResult(d.history||[]);})
    .catch(function(){
      document.getElementById('historyChartWrap').style.display='none';
      document.getElementById('historyEmpty').style.display='block';
      document.getElementById('historyEmpty').textContent='加载失败，请稍后重试';
    });
}

function drawHistoryResult(history){
  if(history.length===0){
    document.getElementById('historyChartWrap').style.display='none';
    document.getElementById('historyEmpty').style.display='block';
    document.getElementById('historyEmpty').textContent='暂无火价历史数据';
    document.getElementById('historyStats').innerHTML='';
    return;
  }
  document.getElementById('historyChartWrap').style.display='block';
  document.getElementById('historyEmpty').style.display='none';

  // 计算统计数字
  var prices=history.map(function(p){return parseFloat(p.fire_price)});
  var latest=prices[prices.length-1];
  var first=prices[0];
  var high=Math.max.apply(null,prices);
  var low=Math.min.apply(null,prices);
  var change=latest-first;
  var changePct=first>0?(change/first*100).toFixed(1):0;
  var upClass=change>=0?'up':'down';
  var arrow=change>=0?'↑':'↓';
  document.getElementById('historyStats').innerHTML=
    '<div class="m-stat"><div class="l">当前火价</div><div class="v fire">'+latest.toFixed(2)+'</div></div>'+
    '<div class="m-stat"><div class="l">涨跌</div><div class="v '+upClass+'">'+arrow+' '+Math.abs(change).toFixed(2)+' ('+changePct+'%)</div></div>'+
    '<div class="m-stat"><div class="l">最高</div><div class="v" style="color:var(--fire)">'+high.toFixed(2)+'</div></div>'+
    '<div class="m-stat"><div class="l">最低</div><div class="v" style="color:var(--muted)">'+low.toFixed(2)+'</div></div>'+
    '<div class="m-stat"><div class="l">数据点</div><div class="v" style="color:var(--muted)">'+history.length+'</div></div>';
  drawHistoryChart(history);
}

function drawHistoryChart(history){
  var labels=history.map(function(p){return p.scraped_time});
  var prices=history.map(function(p){return parseFloat(p.fire_price.toFixed(2))});
  var minP=Math.min.apply(null,prices),maxP=Math.max.apply(null,prices);
  var pad=(maxP-minP)*0.1||1;

  if(_hist.chart){_hist.chart.destroy()}
  var ctx=document.getElementById('historyChart').getContext('2d');
  _hist.chart=new Chart(ctx,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:'火价',
        data:prices,
        borderColor:'#f59e0b',
        backgroundColor:'rgba(245,158,11,0.08)',
        borderWidth:2,
        pointRadius:history.length>40?0:4,
        pointBackgroundColor:'#f59e0b',
        pointBorderColor:'#13172a',
        pointBorderWidth:2,
        fill:true,
        tension:0.35
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#1a2035',
          borderColor:'#f59e0b',
          borderWidth:1,
          titleColor:'#e2e8f0',
          bodyColor:'#f59e0b',
          padding:10,
          callbacks:{label:function(ctx){return'火价: '+ctx.parsed.y.toFixed(2)}}
        }
      },
      scales:{
        x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#64748b',maxTicksLimit:10,font:{size:11}}},
        y:{min:minP-pad,max:maxP+pad,grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#64748b',font:{size:11},callback:function(v){return v.toFixed(1)}}}
      }
    }
  });
}

function doImportItems(){if(!_IMPORT||!_IMPORT.data||!_IMPORT.data.length)return;var secMap={};STATE.sections.forEach(function(sec){secMap[sec.name]=sec});var newSec=0,updated=0,added=0,unmatched=0;_IMPORT.data.forEach(function(row){var sec=secMap[row.secName];if(!sec){sec={id:Date.now()+Math.random(),name:row.secName,damage:0,items:[]};STATE.sections.push(sec);secMap[row.secName]=sec;newSec++}var existingIdx=sec.items.findIndex(function(i){return i.name===row.itemName});var db=STATE.rawItems.find(function(d){return d.name===row.itemName});if(existingIdx>=0){var existing=sec.items[existingIdx];if(db){existing.price=parseFloat(db.price)||0;existing.type=db.type||"";existing.id=db.item_id||db.物品ID||existing.id}existing.more=row.more;existing.count=row.count;updated++}else{var key=db?(db.item_id||db.物品ID||db.name):(row.itemName);sec.items.push({id:key,name:row.itemName,type:db?(db.type||""):"",price:db?(parseFloat(db.price)||0):0,more:row.more,count:row.count,last_time:null});if(db){added++}else{unmatched++}}});saveSections();var txt="导入完成：🔄覆盖 "+updated+" 条";if(newSec>0)txt+="，新增 "+newSec+" 板块";if(added>0)txt+="，新增 "+added+" 物品（已匹配）";if(unmatched>0)txt+="，⚠️未匹配 "+unmatched+" 条（按CSV原价计入）";_showImportResult("success",txt);document.getElementById("confirmImportBtn").disabled=true;STATE._dirty=null;renderAll(true);setTimeout(closeImportModal,2500)}

function escHtml(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function escAttr(s){return(s||"").replace(/'/g,"\\'").replace(/"/g,"&quot;")}

function fmtFireDmg(item,if2){
  if(!if2||!item.more)return"-";
  return(if2/item.more*10).toFixed(2);
}

function updateSectionDamage(secId,val){
  var sec=STATE.sections.find(function(s){return Number(s.id)===Number(secId)});
  if(sec){sec.damage=parseFloat(val);if(isNaN(sec.damage))sec.damage=0;}
  saveSections();
  STATE._dirty=secId;renderAll(false);
}
function fmtSecDmgInput(secId,damage){
  var v=damage==null?0:damage;
  return'<div class="section-dmg-wrap"><span class="dmg-label">每10more </span><input class="section-damage" type="number" step="any" value="'+v+'" placeholder="0" onkeydown="if(event.keyCode===13){updateSectionDamage('+secId+',this.value);this.blur()}"><span class="dmg-label">火</span></div>';
}
function fmtWorth(item,secDamage){
  var p=item.price||0;
  if(!p||secDamage==null||secDamage===undefined)return"";
  var actual=p/(item.more||1)*10;
  var R=parseFloat(secDamage)||0;
  var w=actual<=R;
  var cls=w?"worth-good":"worth-bad";
  var txt=w?"值":"不值";
  return"<span class=\""+cls+"\">"+txt+"</span>";
}
function handleThClick(th,secId){
  var key=th.dataset.sort;
  var dir=STATE.sortDir[key]==='asc'?'desc':'asc';
  STATE.sortDir[key]=dir;
  sortItems(secId,key,dir);
  th.style.color='var(--fire)';
  setTimeout(function(){th.style.color=''},1000);
}
function sortItems(secId,key,dir){
  var sec=STATE.sections.find(function(s){return Number(s.id)===Number(secId)});
  if(!sec)return;
  sec.items.sort(function(a,b){
    var av=0,bv=0;
    if(key==='fire'){av=calcItemFire(a)||0;bv=calcItemFire(b)||0}
    else if(key==='rmb'){av=RMB(calcItemFire(a))||0;bv=RMB(calcItemFire(b))||0}
    else if(key==='fireDmg'){var ia=calcItemFire(a)||0;av=ia&&a.more?(ia/a.more*10):0;var ib=calcItemFire(b)||0;bv=ib&&b.more?(ib/b.more*10):0}
    else if(key==='time'){av=a.last_time||0;bv=b.last_time||0}
    else return 0;
    return dir==='asc'?av-bv:bv-av;
  });
  saveSections();
  STATE._dirty=secId;renderAll(false);
}

function onSectionDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';var card=e.currentTarget;var rect=card.getBoundingClientRect();var mid=rect.top+rect.height/2;document.querySelectorAll('.section-card').forEach(function(el){el.classList.remove('drag-over','drag-under')});if(e.clientY<mid){card.classList.add('drag-over');card.classList.remove('drag-under')}else{card.classList.add('drag-under');card.classList.remove('drag-over')}}
function onSectionDrop(e){e.preventDefault();var targetCard=e.currentTarget;var dragSecId=window._dragSecId;if(!dragSecId)return;var targetSecId=targetCard.dataset.secId;if(String(dragSecId)===String(targetSecId))return;var dragIdx=STATE.sections.findIndex(function(s){return String(s.id)===String(dragSecId)});var targetIdx=STATE.sections.findIndex(function(s){return String(s.id)===String(targetSecId)});if(dragIdx<0||targetIdx<0)return;var rect=targetCard.getBoundingClientRect();var mid=rect.top+rect.height/2;if(e.clientY>=mid)targetIdx++;if(targetIdx>dragIdx)targetIdx--;var moved=STATE.sections.splice(dragIdx,1)[0];STATE.sections.splice(targetIdx,0,moved);saveSections();renderAll();}

        <div class="modal-header-title">导入装备列表</div>
        <button class="modal-close" onclick="closeImportModal()">✕</button>
      </div>
    <div class="modal-body">
      <div class="import-form">
        <div class="import-field">
          <div class="import-field-label">上传 CSV 文件</div>
          <div class="import-file-drop">
            <input type="file" id="importFileInput" accept=".csv,.txt" onchange="handleImportFile(this)">
            <div class="import-file-icon">📄</div>
            <div class="import-file-text">
              <div class="ifttitle">点击或拖拽上传 CSV 文件</div>
              <div class="ifhint">UTF-8 编码，格式：板块名称, 物品名称, MORE, 数量</div>
            </div>
          </div>
          <div id="importFileName" class="import-file-name"></div>
        </div>
      </div>
      <div id="importPreview" class="import-preview" style="display:none"></div>
      <div id="importResult" class="import-result" style="display:none"></div>
    </div>
    <div class="modal-footer">

</div>
