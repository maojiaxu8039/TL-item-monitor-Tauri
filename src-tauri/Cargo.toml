[package]
name = "torchscan"
version = "1.0.0"
edition = "2021"
default-run = "torchscan"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"

# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
parking_lot = "0.12"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
csv = "1"
base64 = "0.22"

# Tracing / logging
tracing = "0.1"

# HTTP (for scrapers)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"] }

# Gzip decompression (for etor protobuf prices)
flate2 = "1"

# Brotli decompression (for etor beta API)
brotli = "3"

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Cryptography (for HMAC signing)
ring = "0.17"

# Random number generation
rand = "0.8"
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
