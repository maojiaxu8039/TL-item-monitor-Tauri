name: Build Server Binary

on:
  push:
    branches:
      - main
    paths:
      - 'server-standalone/**'
      - 'src-tauri/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4

      - name: Install cross and target
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo install cross --version 0.2.4

      - name: Build with cross
        run: |
          cd server-standalone
          cross build --release --target aarch64-unknown-linux-gnu

      - name: Check binary
        run: |
          ls -lh server-standalone/target/aarch64-unknown-linux-gnu/release/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tl-monitor-server
          path: server-standalone/target/aarch64-unknown-linux-gnu/release/server
          retention-days: 1