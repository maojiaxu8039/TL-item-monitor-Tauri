name: Build Server Binary

on:
  push:
    branches:
      - main
    paths:
      - 'server-standalone/**'
      - 'src-tauri/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Add target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Build server-standalone
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu
          ls -lh target/aarch64-unknown-linux-gnu/release/server || target/release/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tl-monitor-server
          path: |
            server-standalone/target/aarch64-unknown-linux-gnu/release/server
            server-standalone/target/release/server
          retention-days: 1