name: Build Server (Docker Image)

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/src/server/**'
      - 'src-tauri/src/bin/server.rs'
      - 'src-tauri/src/scraper/**'
      - 'src-tauri/src/db/repo_*.rs'
      - 'src-tauri/Cargo.toml'
      - 'server-docker/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tl-monitor-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build server binary (static, musl)
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cd src-tauri
          cargo build --release --bin server --target x86_64-unknown-linux-musl
          ls -la target/x86_64-unknown-linux-musl/release/server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Copy binary to docker context
        run: |
          mkdir -p server-docker/bin
          cp src-tauri/target/x86_64-unknown-linux-musl/release/server server-docker/bin/
          ls -la server-docker/bin/

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: ./server-docker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./server-docker/Dockerfile.prebuilt

      - name: Deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## 🚀 Server Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY