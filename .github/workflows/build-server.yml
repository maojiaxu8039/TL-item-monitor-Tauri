name: Build Server (Docker Image)

on:
  push:
    branches:
      - main
    paths:
      - 'server-standalone/**'
      - 'server-docker/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tl-monitor-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libssl-dev

      - name: Build server binary
        env:
          CARGO_INCREMENTAL: 0
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu
          ls -la target/aarch64-unknown-linux-gnu/release/

      - name: Verify build output
        run: |
          cd server-standalone
          file target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          ldd target/aarch64-unknown-linux-gnu/release/tl-monitor-server 2>&1 | head -10

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Copy binary to docker context
        run: |
          mkdir -p server-docker/bin
          cp server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server server-docker/bin/server
          ls -la server-docker/bin/

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./server-docker
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./server-docker/Dockerfile.prebuilt

      - name: Deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## 🚀 Server Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY