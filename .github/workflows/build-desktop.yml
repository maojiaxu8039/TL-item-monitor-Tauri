name: Build Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'vite.config.ts'
      - '.github/workflows/build-desktop.yml'
    # 跳过以下前缀的 commit message（用于文档/琐碎修改）
    # 在 commit 信息中包含 [skip ci] 即可跳过
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            server-standalone
          shared-key: "verify"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run typecheck && npm run lint && npm run test:coverage

      - name: Test desktop backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test standalone server
        run: cargo test --manifest-path server-standalone/Cargo.toml

  build-windows:
    needs: verify
    runs-on: windows-2022
    if: |
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !startsWith(github.event.head_commit.message, 'docs:')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows"

      - name: Install dependencies
        run: npm ci

      - name: Download embedded Node.js
        run: node scripts/download-embedded-node.mjs

      - name: Build Tauri app
        run: npm run build
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  build-macos:
    needs: verify
    runs-on: macos-15
    if: |
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !startsWith(github.event.head_commit.message, 'docs:')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin

      - name: Verify Rust toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          hash -r
          which cargo
          type -a cargo
          cargo --version
          rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "macos"

      - name: Install dependencies
        run: npm ci

      - name: Download embedded Node.js
        run: node scripts/download-embedded-node.mjs

      - name: Build Tauri app (macOS)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO="$HOME/.cargo/bin/cargo"
          hash -r
          which cargo
          npm run build -- --bundles app
        env:
          CI: true

      - name: Ad-hoc code sign
        run: |
          find src-tauri/target/release/bundle -name "*.app" -type d | while read app; do
            codesign --force --deep --sign - "$app"
            echo "Signed: $app"
          done

      - name: Remove quarantine attribute
        run: |
          find src-tauri/target/release/bundle -name "*.app" -type d | while read app; do
            xattr -cr "$app"
            echo "Removed quarantine from: $app"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-app
          path: |
            src-tauri/target/release/bundle/**/*.app
          retention-days: 7
