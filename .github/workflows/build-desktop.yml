name: Build Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "macos"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build:dmg
        env:
          CI: true

      - name: Ad-hoc code sign
        run: |
          find src-tauri/target/release/bundle -name "*.app" -type d | while read app; do
            codesign --force --deep --sign - "$app"
            echo "Signed: $app"
          done

      - name: Remove quarantine attribute
        run: |
          find src-tauri/target/release/bundle -name "*.app" -type d | while read app; do
            xattr -cr "$app"
            echo "Removed quarantine from: $app"
          done
          find src-tauri/target/release/bundle -name "*.dmg" -type f | while read dmg; do
            xattr -cr "$dmg"
            echo "Removed quarantine from: $dmg"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-app
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
          retention-days: 7