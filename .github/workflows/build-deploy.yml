name: Build and Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'server-docker/**'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tl-monitor-server
  ARCH: aarch64-unknown-linux-gnu
  TARGET: aarch64-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ env.ARCH }}
          override: true

      - name: Install cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.TARGET }} libc6-dev-${{ env.TARGET }} pkg-config libssl-dev

      - name: Build server binary
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C target-feature=-crt-static"
          CC: ${{ env.TARGET }}-gcc
        run: |
          cd src-tauri
          cargo build --release --bin server --target ${{ env.ARCH }}
          strip target/${{ env.ARCH }}/release/server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Copy binary to docker context
        run: |
          mkdir -p server-docker/bin
          cp src-tauri/target/${{ env.ARCH }}/release/server server-docker/bin/

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./server-docker
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./server-docker/Dockerfile.prebuilt

      - name: Create deployment summary
        run: |
          echo "## 🚀 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### NAS Deployment" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# SSH 到 NAS 后执行：" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker stop tl-monitor-server || true" >> $GITHUB_STEP_SUMMARY
          echo "docker rm tl-monitor-server || true" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name tl-monitor-server \\" >> $GITHUB_STEP_SUMMARY
          echo "  --restart unless-stopped \\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 38457:8080 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /data_s001/data/udata/real/15510607744/Docker/tl-monitor/data:/data \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /data_s001/data/udata/real/15510607744/Docker/tl-monitor/config:/app/config \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /data_s001/data/udata/real/15510607744/Docker/tl-monitor/resources:/app/resources \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY