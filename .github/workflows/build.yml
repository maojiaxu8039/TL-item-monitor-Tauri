name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "macos"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build:dmg
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-app
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify server-standalone exists
        run: |
          ls -la server-standalone/

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu
          tools: cargo

      - name: Install cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libssl-dev

      - name: Build server binary
        env:
          CC: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu
          ls -la target/aarch64-unknown-linux-gnu/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-server
          path: server-standalone/target/aarch64-unknown-linux-gnu/release/server
          retention-days: 7

  release:
    needs: [build-windows, build-macos, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: macos

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-server
          path: linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/**/*.exe
            macos/**/*.dmg
            linux-arm64/server
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}