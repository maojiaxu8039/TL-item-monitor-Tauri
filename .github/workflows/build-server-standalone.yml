name: Build Server (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'server-standalone/**'
      - '.github/workflows/build-server-standalone.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libssl-dev

      - name: Build server binary
        env:
          CARGO_INCREMENTAL: 0
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify build output
        run: |
          cd server-standalone
          file target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          ldd target/aarch64-unknown-linux-gnu/release/tl-monitor-server 2>&1 | head -10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-server
          path: server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          retention-days: 30

      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./server-docker
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tl-monitor-server:latest
            ghcr.io/${{ github.repository_owner }}/tl-monitor-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./server-docker/Dockerfile.prebuilt

      - name: Deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## 🚀 Server Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** linux-arm64-server" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository_owner }}/tl-monitor-server: sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# 下载 ARM64 二进制" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run download-arm64.yml -f run_id=${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY