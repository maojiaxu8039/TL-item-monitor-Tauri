name: Build Server (ARM64)

on:
  push:
    branches:
      - main
    paths:
      - 'server-standalone/**'
      - '.github/workflows/build-server-arm64.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cross compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build server binary (ARM64)
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu --no-default-features

      - name: Verify build output
        run: |
          cd server-standalone
          file target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          ldd target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          ls -lh target/aarch64-unknown-linux-gnu/release/tl-monitor-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-server
          path: server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          retention-days: 30

      - name: Deployment summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## ARM64 Server Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** linux-arm64-server" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**兼容性:** 需要 GLIBC (通过 ldd 检查依赖)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
