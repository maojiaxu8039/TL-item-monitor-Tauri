name: Build Server (ARM64)

on:
  push:
    branches:
      - main
    paths:
      - 'server-standalone/**'
      - 'src-tauri/resources/item_id_mapping.json'
      - 'src-tauri/resources/qiandao_fire.cjs'
      - 'src-tauri/resources/qiandao_fire.mjs'
      - '.github/workflows/build-server-arm64.yml'
  workflow_dispatch:

concurrency:
  group: server-arm64-build
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-standalone
          shared-key: "server-test"

      - name: Test server
        run: cargo test --manifest-path server-standalone/Cargo.toml -- --test-threads=1

  build:
    needs: test
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !startsWith(github.event.head_commit.message, 'docs:')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install ARM64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cross compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build server binary (ARM64)
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu --no-default-features

      - name: Verify build output
        run: |
          cd server-standalone
          file target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          ls -lh target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          aarch64-linux-gnu-readelf -h target/aarch64-unknown-linux-gnu/release/tl-monitor-server | grep -E '(Machine|Class|OS/ABI)'

      - name: Package deploy files
        run: |
          rm -rf server-standalone/dist
          mkdir -p server-standalone/dist/linux-arm64-server/resources
          cp server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server server-standalone/dist/linux-arm64-server/
          cp server-standalone/server_config.example.yaml server-standalone/dist/linux-arm64-server/server_config.example.yaml
          cp src-tauri/resources/item_id_mapping.json server-standalone/dist/linux-arm64-server/resources/
          cp src-tauri/resources/qiandao_fire.cjs server-standalone/dist/linux-arm64-server/resources/
          cp src-tauri/resources/qiandao_fire.mjs server-standalone/dist/linux-arm64-server/resources/
          cd server-standalone/dist
          tar -czf linux-arm64-server.tar.gz linux-arm64-server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-server
          path: |
            server-standalone/dist/linux-arm64-server.tar.gz
            server-standalone/dist/linux-arm64-server/**
          retention-days: 30

      - name: Build summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## ARM64 Server Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** linux-arm64-server" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**包含文件:**" >> $GITHUB_STEP_SUMMARY
          echo "- `tl-monitor-server` - ARM64 二进制" >> $GITHUB_STEP_SUMMARY
          echo "- `server_config.example.yaml` - 配置示例" >> $GITHUB_STEP_SUMMARY
          echo "- `resources/` - 资源脚本" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**部署方式:** 下载 artifact → 上传到极空间 → volume 挂载覆盖容器内二进制 → 重启容器" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
