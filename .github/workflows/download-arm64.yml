name: Download Linux ARM64 Build (Static GNU)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libssl-dev

      - name: Build server binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify build output
        run: |
          cd server-standalone
          ls -la target/aarch64-unknown-linux-gnu/release/
          file target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          ldd target/aarch64-unknown-linux-gnu/release/tl-monitor-server 2>&1 | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-server
          path: server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server
          retention-days: 7