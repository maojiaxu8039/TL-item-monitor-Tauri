name: Download Linux ARM64 Build (Static Musl)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-unknown-linux-musl
          override: true

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-dev musl-tools

      - name: Build server binary with static linking
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          SQLITE_LIB_DIR: /usr/aarch64-linux-gnu/lib
          SQLITE_INCLUDE_DIR: /usr/aarch64-linux-gnu/include
        run: |
          rustup target add aarch64-unknown-linux-musl
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Verify build output
        run: |
          cd server-standalone
          ls -la target/aarch64-unknown-linux-musl/release/
          file target/aarch64-unknown-linux-musl/release/tl-monitor-server
          ldd target/aarch64-unknown-linux-musl/release/tl-monitor-server 2>&1 || echo "Binary compiled"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-server-static
          path: server-standalone/target/aarch64-unknown-linux-musl/release/tl-monitor-server
          retention-days: 7