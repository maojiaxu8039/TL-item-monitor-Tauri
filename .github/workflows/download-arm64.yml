name: Download Linux ARM64 Build (Static Musl)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-musl

      - name: Install musl cross compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build server binary with static linking
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cd server-standalone
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Verify build output
        run: |
          cd server-standalone
          ls -la target/
          ls -la target/aarch64-unknown-linux-musl/
          ls -la target/aarch64-unknown-linux-musl/release/
          echo "Checking for binary file..."
          find target/aarch64-unknown-linux-musl/release -type f -executable
          file target/aarch64-unknown-linux-musl/release/tl-monitor-server
          ldd target/aarch64-unknown-linux-musl/release/tl-monitor-server || echo "Statically linked (no ldd output)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-server-static
          path: server-standalone/target/aarch64-unknown-linux-musl/release/tl-monitor-server
          retention-days: 7
