name: Download Linux ARM64 Build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to download from'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-server
          path: ./server-standalone/target/aarch64-unknown-linux-gnu/release/

      - name: Verify binary
        run: |
          cd server-standalone/target/aarch64-unknown-linux-gnu/release/
          ls -la tl-monitor-server
          file tl-monitor-server

      - name: Create tarball
        run: |
          cd server-standalone/target/aarch64-unknown-linux-gnu/release/
          tar -czf tl-monitor-server-arm64.tar.gz tl-monitor-server
          ls -la *.tar.gz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tl-monitor-server-arm64-tarball
          path: server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server-arm64.tar.gz
          retention-days: 30

      - name: Summary
        run: |
          echo "## 📦 Download Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Binary: `server-standalone/target/aarch64-unknown-linux-gnu/release/tl-monitor-server`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact from the Actions run." >> $GITHUB_STEP_SUMMARY